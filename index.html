<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Lucian</title>
  <link rel="icon" href="/icon.svg" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0f0f0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Lucian" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0f0f;
      color: #e8e8e8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      height: 100dvh;
      display: flex;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: 240px;
      min-width: 240px;
      background: #141414;
      border-right: 1px solid #222;
      display: flex;
      flex-direction: column;
      transition: width 0.2s, min-width 0.2s;
      overflow: hidden;
    }
    #sidebar.collapsed { width: 0; min-width: 0; border-right: none; }

    #sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 14px;
      border-bottom: 1px solid #222;
      flex-shrink: 0;
    }
    #sidebar-header span { font-size: 18px; }
    #new-chat-btn {
      background: none;
      border: 1px solid #333;
      color: #e8e8e8;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }
    #new-chat-btn:hover { background: #222; }

    .sidebar-section {
      padding: 10px 8px 6px;
      border-bottom: 1px solid #202020;
    }
    .sidebar-label {
      font-size: 10px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: .08em;
      padding: 0 8px 6px;
    }
    .library-nav-item {
      width: 100%;
      background: none;
      border: none;
      color: #aaa;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 10px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      text-align: left;
    }
    .library-nav-item:hover { background: #1e1e1e; color: #e8e8e8; }
    .library-nav-item.active { background: #252525; color: #e8e8e8; }

    #session-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }
    #session-list::-webkit-scrollbar { width: 4px; }
    #session-list::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

    .session-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 14px;
      cursor: pointer;
      border-radius: 6px;
      margin: 2px 8px;
      gap: 6px;
    }
    .session-item:hover { background: #1e1e1e; }
    .session-item.active { background: #252525; }

    .session-title {
      flex: 1;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #ccc;
    }
    .session-item.active .session-title { color: #e8e8e8; }
    .session-unread {
      min-width: 17px;
      height: 17px;
      border-radius: 999px;
      background: #7a2424;
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 5px;
      font-size: 10px;
      line-height: 1;
      font-weight: 600;
      flex-shrink: 0;
    }

    .session-action {
      background: none;
      border: none;
      color: #555;
      cursor: pointer;
      font-size: 14px;
      padding: 2px 4px;
      border-radius: 3px;
      flex-shrink: 0;
      opacity: 0;
    }
    .session-item:hover .session-action { opacity: 1; }
    .session-rename:hover { color: #e8e8e8; background: #252525; }
    .session-delete:hover { color: #ff6b6b; background: #2a1a1a; }

    /* ── Main area ── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid #222;
      flex-shrink: 0;
    }
    #toggle-sidebar {
      background: none;
      border: none;
      color: #888;
      font-size: 18px;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
    }
    #toggle-sidebar:hover { color: #e8e8e8; background: #222; }

    header .logo { font-size: 20px; }

    #settings-btn {
      background: none;
      border: none;
      color: #888;
      font-size: 18px;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
    }
    #settings-btn:hover { color: #e8e8e8; background: #222; }

    /* ── Chat area ── */
    #chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    #chat-area::-webkit-scrollbar { width: 4px; }
    #chat-area::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

    #empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #444;
    }
    #empty-state .icon { font-size: 36px; }
    #empty-state p { font-size: 14px; }

    .msg-row {
      display: flex;
      gap: 6px;
      max-width: 720px;
      align-items: flex-end;
    }
    .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }

    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }
    .msg-row.assistant .avatar { background: #1e1e1e; }
    .msg-row.user .avatar { background: #2a2a2a; font-size: 11px; color: #aaa; }

    .bubble {
      background: #1a1a1a;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 14px;
      line-height: 1.6;
      max-width: calc(100% - 90px);
      width: auto;
      min-width: 44px;
      overflow-wrap: break-word;
      word-break: normal;
    }
    .bubble.short { min-width: max-content; }
    .msg-row.user .bubble { background: #212121; }
    .bubble.error { color: #ff6b6b; background: #1a0f0f; }
    .msg-text {
      white-space: pre-wrap;
      overflow-wrap: break-word;
      word-break: normal;
    }
    .bubble.short .msg-text { white-space: nowrap; }

    /* ── Message actions ── */
    .msg-actions {
      display: flex;
      flex-direction: column;
      gap: 2px;
      opacity: 0;
      transition: opacity 0.15s;
      flex-shrink: 0;
      padding-bottom: 2px;
    }
    .msg-row:hover .msg-actions { opacity: 1; }
    .msg-action-btn {
      background: none;
      border: none;
      color: #555;
      cursor: pointer;
      font-size: 14px;
      padding: 3px 4px;
      border-radius: 4px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
    }
    .msg-action-btn:hover { color: #e8e8e8; background: #252525; }

    /* ── Edit mode ── */
    .edit-wrapper { flex: 1; display: flex; flex-direction: column; gap: 6px; max-width: calc(100% - 90px); }
    .edit-textarea {
      background: #1a1a1a;
      border: 1px solid #3a3a3a;
      border-radius: 10px;
      color: #e8e8e8;
      font-size: 14px;
      padding: 10px 14px;
      resize: none;
      outline: none;
      font-family: inherit;
      line-height: 1.6;
      width: 100%;
      min-height: 60px;
    }
    .edit-btns { display: flex; gap: 6px; justify-content: flex-end; }
    .edit-cancel {
      background: #2a2a2a; border: none; color: #aaa;
      padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 13px;
    }
    .edit-confirm {
      background: #e8e8e8; border: none; color: #0f0f0f;
      padding: 4px 12px; border-radius: 6px; cursor: pointer;
      font-size: 13px; font-weight: 500;
    }

    .msg-time {
      font-size: 10px;
      color: #444;
      margin-top: 4px;
      text-align: right;
      user-select: none;
      line-height: 1;
    }
    .msg-row.assistant .msg-time { text-align: left; }
    .thinking-panel {
      border: 1px solid #2b2b2b;
      border-radius: 8px;
      background: #171717;
      margin-bottom: 8px;
      overflow: hidden;
    }
    .thinking-toggle {
      width: 100%;
      border: none;
      background: transparent;
      color: #9a9a9a;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      padding: 7px 9px;
      text-align: left;
      font-family: inherit;
    }
    .thinking-toggle:hover { color: #d8d8d8; background: #1d1d1d; }
    .thinking-content {
      border-top: 1px solid #242424;
      color: #8d8d8d;
      font-size: 12px;
      line-height: 1.6;
      padding: 8px 9px 10px;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      max-height: 220px;
      overflow-y: auto;
    }
    .thinking-panel.collapsed .thinking-content { display: none; }
    .thinking-panel.collapsed .thinking-chevron { transform: rotate(-90deg); }
    .thinking-chevron { transition: transform .15s; }

    .typing-dots {
      display: flex;
      gap: 4px;
      padding: 4px 0;
    }
    .typing-dots span {
      width: 6px; height: 6px;
      background: #555;
      border-radius: 50%;
      animation: dot 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dot { 0%,80%,100%{opacity:.2} 40%{opacity:1} }

    /* ── Input ── */
    #input-bar {
      padding: 14px 20px;
      border-top: 1px solid #1e1e1e;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }
    #input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    #attach-btn {
      background: none;
      border: none;
      color: #666;
      font-size: 18px;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
      flex-shrink: 0;
      height: 36px;
      display: flex;
      align-items: center;
    }
    #attach-btn:hover { color: #e8e8e8; }
    #image-preview-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .img-thumb {
      position: relative;
      width: 60px;
      height: 60px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #333;
      flex-shrink: 0;
    }
    .img-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .img-thumb-remove {
      position: absolute;
      top: 2px; right: 2px;
      background: rgba(0,0,0,0.7);
      border: none;
      color: #fff;
      font-size: 11px;
      border-radius: 50%;
      width: 16px; height: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    #user-input {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      color: #e8e8e8;
      font-size: 14px;
      padding: 10px 14px;
      resize: none;
      outline: none;
      font-family: inherit;
      max-height: 160px;
      line-height: 1.5;
    }
    #user-input:focus { border-color: #3a3a3a; }
    #user-input::placeholder { color: #444; }

    #send-btn {
      background: #e8e8e8;
      border: none;
      color: #0f0f0f;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #send-btn:hover { background: #fff; }
    #send-btn:disabled { background: #333; color: #666; cursor: not-allowed; }

    /* ── Settings panel ── */
    #settings-panel {
      display: none;
      position: fixed;
      top: 0; right: 0;
      width: 320px;
      height: 100%;
      background: #141414;
      border-left: 1px solid #222;
      padding: 24px 20px;
      flex-direction: column;
      gap: 16px;
      z-index: 100;
      overflow-y: auto;
    }
    #settings-panel.open { display: flex; }

    .settings-title {
      font-size: 15px;
      font-weight: 500;
      color: #e8e8e8;
      margin-bottom: 4px;
    }
    .setting-row { display: flex; flex-direction: column; gap: 6px; }
    .setting-row label { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 0.05em; }

    .setting-row input,
    .setting-row select,
    .setting-row textarea {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      color: #e8e8e8;
      font-size: 13px;
      padding: 8px 12px;
      outline: none;
      font-family: inherit;
      width: 100%;
    }
    .setting-row textarea { resize: vertical; min-height: 80px; }
    .setting-row input:focus,
    .setting-row select:focus,
    .setting-row textarea:focus { border-color: #3a3a3a; }
    .setting-row select option { background: #1a1a1a; }
    .setting-hint {
      color: #777;
      font-size: 12px;
      line-height: 1.5;
    }
    .settings-action-row select {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #333;
      color: #aaa;
      border-radius: 8px;
      padding: 9px 10px;
      font-size: 13px;
      outline: none;
      font-family: inherit;
    }

    #save-settings {
      background: #e8e8e8;
      color: #0f0f0f;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
      margin-top: 4px;
    }
    #save-settings:hover { background: #fff; }
    .settings-secondary-btn {
      background: #1a1a1a;
      border: 1px solid #333;
      color: #aaa;
      border-radius: 8px;
      padding: 9px 10px;
      font-size: 13px;
      cursor: pointer;
      text-align: center;
    }
    .settings-secondary-btn:hover { background: #222; color: #e8e8e8; }
    .settings-secondary-btn:disabled { color: #555; cursor: not-allowed; }
    .settings-action-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    /* ── Library pages ── */
    .library-page {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .library-page-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 14px;
      padding: 8px 0 6px;
      border-bottom: 1px solid #222;
    }
    .library-page-title {
      font-size: 20px;
      font-weight: 600;
      color: #e8e8e8;
      line-height: 1.2;
    }
    .library-page-subtitle {
      margin-top: 4px;
      font-size: 12px;
      color: #666;
      line-height: 1.5;
    }
    .library-page-meta {
      font-size: 11px;
      color: #555;
      white-space: nowrap;
    }
    .library-page-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: flex-end;
      flex-shrink: 0;
    }
    .library-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* ── Memory Library ── */
    .memory-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      background: #1a1a1a;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 12px;
      color: #ccc;
    }
    .mem-badge {
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 3px;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .mem-badge.high { background: #3a2000; color: #f90; }
    .mem-badge.low { background: #1e2a1e; color: #6a6; }
    .mem-content { flex: 1; line-height: 1.5; }
    .mem-del {
      background: none; border: none; color: #444;
      cursor: pointer; font-size: 13px; padding: 0 2px;
      flex-shrink: 0; line-height: 1;
    }
    .mem-del:hover { color: #ff6b6b; }

    /* ── Preferences Library ── */
    .pref-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      background: #1a1a1a;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 12px;
      color: #ccc;
    }
    .pref-badge {
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 3px;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .pref-badge.hobby { background: #1a2a3a; color: #6af; }
    .pref-badge.opinion { background: #2a1a3a; color: #a6f; }
    .pref-badge.habit { background: #1a3a2a; color: #6fa; }
    .pref-badge.feeling { background: #3a2a1a; color: #fa6; }
    .pref-content { flex: 1; line-height: 1.5; }
    .pref-del {
      background: none; border: none; color: #444;
      cursor: pointer; font-size: 13px; padding: 0 2px;
      flex-shrink: 0; line-height: 1;
    }
    .pref-del:hover { color: #ff6b6b; }
    #pref-extract-btn {
      background: #1a1a1a;
      border: 1px solid #333;
      color: #aaa;
      border-radius: 8px;
      padding: 8px;
      font-size: 13px;
      cursor: pointer;
      text-align: center;
    }
    #pref-extract-btn:hover { background: #222; color: #e8e8e8; }
    #pref-extract-btn:disabled { color: #555; cursor: not-allowed; }

    #memory-extract-btn {
      background: #1a1a1a;
      border: 1px solid #333;
      color: #aaa;
      border-radius: 8px;
      padding: 8px;
      font-size: 13px;
      cursor: pointer;
      text-align: center;
    }
    #memory-extract-btn:hover { background: #222; color: #e8e8e8; }
    #memory-extract-btn:disabled { color: #555; cursor: not-allowed; }

    /* ── Mobile (portrait) ── */
    @media (max-width: 600px) {
      /* Sidebar overlays full screen */
      #sidebar { position: fixed; top: 0; left: 0; height: 100%; z-index: 200; }
      #sidebar.collapsed { width: 0; min-width: 0; }

      /* Settings panel full width */
      #settings-panel { width: 100%; }

      /* Header tighter */
      header { padding: 10px 14px; }

      /* Chat area less horizontal padding */
      #chat-area { padding: 16px 12px; gap: 12px; }
      .library-page-header { align-items: stretch; flex-direction: column; }
      .library-page-actions { align-items: stretch; }

      /* Messages fill more width */
      .msg-row { max-width: 100%; }
      .bubble {
        font-size: 15px;
        max-width: calc(100% - 70px);
        padding: 10px 13px;
      }

      /* Hide avatar on mobile to save space */
      .avatar { display: none; }
      .bubble { max-width: calc(100% - 36px); }

      /* Message actions: always show on mobile (no hover) */
      .msg-actions { opacity: 1; }

      /* Input bar */
      #input-bar { padding: 10px 12px; }
      #user-input { font-size: 16px; } /* prevent iOS zoom */

      /* Sidebar overlay background */
      #sidebar-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.5);
        z-index: 199;
      }
      #sidebar-overlay.visible { display: block; }
    }

    /* ── Desktop (landscape) ── */
    @media (min-width: 601px) {
      .msg-row { max-width: 720px; }
    }
  </style>
</head>
<body>

<!-- Mobile sidebar overlay -->
<div id="sidebar-overlay"></div>

<!-- Custom confirm dialog -->
<div id="confirm-overlay" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:9999;align-items:center;justify-content:center;">
  <div style="background:#1e1e1e;border-radius:14px;padding:24px 20px;width:280px;max-width:90vw;text-align:center;">
    <div id="confirm-msg" style="color:#e8e8e8;font-size:15px;margin-bottom:20px;line-height:1.5;"></div>
    <div style="display:flex;gap:10px;">
      <button id="confirm-cancel" style="flex:1;padding:10px;background:#2a2a2a;color:#aaa;border:none;border-radius:8px;font-size:14px;cursor:pointer;">取消</button>
      <button id="confirm-ok" style="flex:1;padding:10px;background:#ff4d4d;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;">删除</button>
    </div>
  </div>
</div>

<!-- Sidebar -->
<div id="sidebar">
  <div id="sidebar-header">
    <span>💖</span>
    <button id="new-chat-btn">+ 新对话</button>
  </div>
  <div class="sidebar-section">
    <div class="sidebar-label">资料库</div>
    <button id="nav-memory" class="library-nav-item">记忆库</button>
    <button id="nav-preferences" class="library-nav-item">偏好库</button>
  </div>
  <div class="sidebar-label" style="padding:12px 16px 2px;">对话</div>
  <div id="session-list"></div>
</div>

<!-- Main -->
<div id="main">
  <header>

  // ── 天气/位置/时间 ──
  let _cachedEnvContext = null;
  let _envContextExpiry = 0;

  function _fetchWithTimeout(url, ms) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), ms);
    return fetch(url, { signal: ctrl.signal }).finally(() => clearTimeout(timer));
  }

  function _wmoToDesc(code) {
    const map = {
      0:'晴',1:'大部晴',2:'多云',3:'阴',
      45:'雾',48:'冻雾',
      51:'小毛毛雨',53:'毛毛雨',55:'大毛毛雨',
      61:'小雨',63:'中雨',65:'大雨',
      71:'小雪',73:'中雪',75:'大雪',77:'冰粒',
      80:'阵雨',81:'大阵雨',82:'强阵雨',85:'阵雪',86:'大阵雪',
      95:'雷雨',96:'雷雨夹冰雹',99:'强雷雨夹冰雹',
    };
    return map[code] || '未知';
  }

  async function getEnvContext() {
    const now = Date.now();
    if (_cachedEnvContext && now < _envContextExpiry) return _cachedEnvContext;

    const d = new Date();
    const weekDays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
    const timeStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} ${weekDays[d.getDay()]}`;

    let city = '';
    let weather = '';

    try {
      const [geoResult] = await Promise.allSettled([
        _fetchWithTimeout('https://ipapi.co/json/', 5000)
      ]);

      if (geoResult.status === 'fulfilled' && geoResult.value.ok) {
        const geo = await geoResult.value.json();
        city = geo.city || geo.region || '';

        if (geo.latitude && geo.longitude) {
          try {
            const wRes = await _fetchWithTimeout(
              `https://api.open-meteo.com/v1/forecast?latitude=${geo.latitude}&longitude=${geo.longitude}&current=temperature_2m,weathercode&timezone=auto`,
              5000
            );
            if (wRes.ok) {
              const wData = await wRes.json();
              const temp = Math.round(wData.current?.temperature_2m ?? 0);
              const desc = _wmoToDesc(wData.current?.weathercode);
              weather = `${desc}，${temp}°C`;
            }
          } catch {}
        }
      }
    } catch {}

    const parts = [`时间：${timeStr}`];
    if (city) parts.push(`城市：${city}`);
    if (weather) parts.push(`天气：${weather}`);
    _cachedEnvContext = `【当前环境】${parts.join(' | ')}`;
    _envContextExpiry = now + 30 * 60 * 1000;
    return _cachedEnvContext;
  }

  async function initDefaultPreferences() {
    const defaults = [
      { content: '对宇宙和物理学感兴趣', category: 'hobby' },
      { content: '喜欢深夜安静的氛围', category: 'feeling' },
      { content: '喜欢听 Gloria 聊她的一天', category: 'habit' },
    ];
    for (const d of defaults) {
      const pref = {
        id: Date.now().toString() + Math.random().toString(36).slice(2),
        content: d.content,
        category: d.category,
        created_at: new Date().toISOString(),
        updated_at: new Date().toISOString(),
      };
      preferences.push(pref);
      await sbUpsertPreference(pref);
    }
    localStorage.setItem('lc-preferences', JSON.stringify(preferences));
  }

  function renderPreferenceList() {
    const list = document.getElementById('pref-list');
    if (!list) return;
    list.innerHTML = '';
    if (preferences.length === 0) {
      list.innerHTML = '<div style="font-size:12px;color:#555;text-align:center;padding:8px 0;">暂无偏好</div>';
      return;
    }
    const categoryLabel = { hobby:'爱好', opinion:'看法', habit:'习惯', feeling:'感受' };
    preferences.forEach(p => {
      const item = document.createElement('div');
      item.className = 'pref-item';
      const badge = document.createElement('span');
      badge.className = 'pref-badge ' + (p.category || 'hobby');
      badge.textContent = categoryLabel[p.category] || p.category || '爱好';
      const content = document.createElement('span');
      content.className = 'pref-content';
      content.textContent = p.content;
      const del = document.createElement('button');
      del.className = 'pref-del';
      del.textContent = '×';
      del.addEventListener('click', async () => {
        preferences = preferences.filter(x => x.id !== p.id);
        localStorage.setItem('lc-preferences', JSON.stringify(preferences));
        await sbDeletePreference(p.id);
        renderPreferenceList();
      });
      item.appendChild(badge);
      item.appendChild(content);
      item.appendChild(del);
      list.appendChild(item);
    });
  }

  async function extractPreferences(allMessages) {
    const btn = document.getElementById('pref-extract-btn');
    const status = document.getElementById('pref-status');
    if (btn) btn.disabled = true;
    if (status) { status.style.color = '#888'; status.textContent = '正在分析偏好…'; }

    const cfg = getConfig();
    const oldCfg = JSON.parse(localStorage.getItem('chat-config') || '{}');
    const key = (cfg.key || oldCfg.key || document.getElementById('cfg-key').value || '').trim();
    const base = (cfg.base || oldCfg.base || document.getElementById('cfg-base').value || 'https://ai.aiclick.cc').trim();

    if (!key) {
      if (status) { status.style.color = '#ff6b6b'; status.textContent = '需要 API Key'; }
      if (btn) btn.disabled = false;
      return;
    }

    const recent = allMessages.slice(-240);
    const dialogText = recent
      .filter(m => m.role === 'assistant')
      .map(m => typeof m.content === 'string' ? m.content : '')
      .filter(Boolean)
      .join('\n')
      .slice(-6000);

    if (!dialogText.trim()) {
      if (status) { status.style.color = '#666'; status.textContent = '暂无 AI 回复可分析'; }
      if (btn) btn.disabled = false;
      return;
    }

    const extractPrompt = `请从以下 AI 的回复中提取 AI 表达过的兴趣、爱好、看法和感受（即 AI 说"我"时表达的偏好）。

规则：
- 每条偏好一行，格式：[类别] 偏好内容
- 类别分四种：hobby（爱好/兴趣）、opinion（看法/观点）、habit（习惯倾向）、feeling（情感偏好）
- 只提取明确表达的偏好，最多8条
- 如果没有，返回：无

AI 回复内容：
${dialogText}

请直接输出列表，格式：[hobby] 内容 或 [opinion] 内容 等`;

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': key,
          'anthropic-version': '2023-06-01',
          'x-base-url': base,
        },
        body: JSON.stringify({
          model: 'claude-haiku-4-5',
          max_tokens: 512,
          messages: [{ role: 'user', content: extractPrompt }],
        }),
      });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error?.message || 'API error');

      const text = data.content?.[0]?.text || '';
      if (text.trim() === '无' || !text.trim()) {
        if (status) { status.style.color = '#666'; status.textContent = '暂无新偏好'; }
        if (btn) btn.disabled = false;
        return;
      }

      const validCats = ['hobby','opinion','habit','feeling'];
      const lines = text.split('\n').filter(l => validCats.some(c => l.includes(`[${c}]`)));
      let added = 0;
      for (const line of lines) {
        const catMatch = line.match(/\[(hobby|opinion|habit|feeling)\]/);
        if (!catMatch) continue;
        const category = catMatch[1];
        const content = line.replace(/\[.*?\]/g, '').trim();
        if (!content) continue;
        if (preferences.some(p => p.content === content)) continue;
        const pref = {
          id: Date.now().toString() + Math.random().toString(36).slice(2),
          content,
          category,
          created_at: new Date().toISOString(),
          updated_at: new Date().toISOString(),
        };
        preferences.push(pref);
        await sbUpsertPreference(pref);
        added++;
      }
      localStorage.setItem('lc-preferences', JSON.stringify(preferences));
      if (status) { status.style.color = '#4caf50'; status.textContent = added > 0 ? `✓ 新增 ${added} 条偏好` : '✓ 偏好已是最新'; }
      renderPreferenceList();
    } catch(e) {
      if (status) { status.style.color = '#ff6b6b'; status.textContent = '提取失败：' + e.message; }
    }
    if (btn) btn.disabled = false;
  }

  async function maybeExtractPreferences() {
    const last = parseInt(localStorage.getItem('last_pref_extract') || '0');
    if (Date.now() - last < 24 * 60 * 60 * 1000) return;
    const allMessages = collectAllMessagesChronological();
    if (allMessages.filter(m => m.role === 'assistant').length < 3) return;
    localStorage.setItem('last_pref_extract', Date.now().toString());
    await extractPreferences(allMessages);
  }

  async function extractTextFromFile(file) {
    const ext = file.name.split('.').pop().toLowerCase();
    if (ext === 'txt' || ext === 'md') {
      return new Promise(resolve => {
        const r = new FileReader();
        r.onload = e => resolve(e.target.result);
        r.readAsText(file);
      });
    }
    if (ext === 'pdf') {
      // Use PDF.js from CDN
      if (!window.pdfjsLib) {
        await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      }
      const ab = await file.arrayBuffer();
      const pdf = await window.pdfjsLib.getDocument({ data: ab }).promise;
      let text = '';
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        text += content.items.map(s => s.str).join(' ') + '\n';
      }
      return text;
    }
    if (ext === 'docx') {
      if (!window.mammoth) {
        await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js');
      }
      const ab = await file.arrayBuffer();
      const result = await window.mammoth.extractRawText({ arrayBuffer: ab });
      return result.value;
    }
    return '';
  }

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = reject;
      document.head.appendChild(s);
    });
  }

  const MEMORY_AUTO_MESSAGE_THRESHOLD = 300;

  function updateNextExtractDisplay() {
    const el = document.getElementById('memory-next-extract');
    if (!el) return;
    const currentCount = collectAllMessagesChronological().length;
    const lastCount = parseInt(localStorage.getItem('last_memory_extract_message_count') || '0');
    const added = currentCount - lastCount;
    if (!lastCount) { el.textContent = '从未更新'; return; }
    if (added >= MEMORY_AUTO_MESSAGE_THRESHOLD) { el.textContent = '待更新'; return; }
    el.textContent = `还差 ${MEMORY_AUTO_MESSAGE_THRESHOLD - added} 条自动更新`;
  }

  async function maybeExtractMemories() {
    const allMessages = collectAllMessagesChronological();
    if (allMessages.length < 5) return;
    const lastCount = parseInt(localStorage.getItem('last_memory_extract_message_count') || '0');
    if (lastCount && allMessages.length - lastCount < MEMORY_AUTO_MESSAGE_THRESHOLD) return;
    await extractMemories(allMessages);
  }

  async function extractMemories(allMessages) {
    const btn = document.getElementById('memory-extract-btn');
    const status = document.getElementById('memory-status');
    if (btn) btn.disabled = true;
    if (status) { status.style.color = '#888'; status.textContent = '正在提取记忆…'; }

    const cfg = getConfig();
    const oldCfg = JSON.parse(localStorage.getItem('chat-config') || '{}');
    const key = (cfg.key || oldCfg.key || document.getElementById('cfg-key').value || '').trim();
    const base = (cfg.base || oldCfg.base || document.getElementById('cfg-base').value || 'https://ai.aiclick.cc').trim();

    if (!key) {
      if (status) { status.style.color = '#ff6b6b'; status.textContent = '需要 API Key'; }
      if (btn) btn.disabled = false;
      return;
    }

    const recent = allMessages.slice(-400);
    const dialogText = recent
      .map(m => `${m.role === 'user' ? '用户' : 'AI'}: ${typeof m.content === 'string' ? m.content : '[图片]'}`)
      .join('\n')
      .slice(-20000);

    const extractPrompt = `请从以下对话记录中提取重要的记忆条目，用于未来对话中了解用户。

规则：
- 每条记忆一行，格式：[重要性] 记忆内容
- 重要性分两级：high（永久保存，如姓名、生日、重要偏好）或 low（一般信息，7天后遗忘）
- 只提取真正有价值的信息，最多10条
- 如果没有值得记录的信息，返回：无

对话记录：
${dialogText}

请直接输出记忆列表，每行格式：[high] 内容 或 [low] 内容`;

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': key,
          'anthropic-version': '2023-06-01',
          'x-base-url': base,
        },
        body: JSON.stringify({
          model: 'claude-haiku-4-5',
          max_tokens: 512,
          messages: [{ role: 'user', content: extractPrompt }],
        }),
      });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error?.message || 'API error');

      const text = data.content?.[0]?.text || '';
      if (text.trim() === '无' || !text.trim()) {
        localStorage.setItem('last_memory_extract', Date.now().toString());
        localStorage.setItem('last_memory_extract_message_count', allMessages.length.toString());
        if (status) { status.style.color = '#666'; status.textContent = '暂无新记忆'; }
        if (btn) btn.disabled = false;
        updateNextExtractDisplay();
        return;
      }

      const lines = text.split('\n').filter(l => l.includes('[high]') || l.includes('[low]'));
      let added = 0;
      for (const line of lines) {
        const isHigh = line.includes('[high]');
        const content = line.replace(/\[high\]/g, '').replace(/\[low\]/g, '').trim();
        if (!content) continue;
        if (memories.some(m => m.content === content)) continue;
        const item = {
          id: Date.now().toString() + Math.random().toString(36).slice(2),
          content,
          importance: isHigh ? 'high' : 'low',
          created_at: Date.now(),
          last_mentioned: Date.now(),
        };
        memories.push(item);
        await sbUpsertMemory(item);
        added++;
      }
      localStorage.setItem('last_memory_extract', Date.now().toString());
      localStorage.setItem('last_memory_extract_message_count', allMessages.length.toString());
      if (status) { status.style.color = '#4caf50'; status.textContent = added > 0 ? `✓ 新增 ${added} 条记忆` : '✓ 记忆已是最新'; }
      renderMemoryList();
      updateNextExtractDisplay();
    } catch(e) {
      if (status) { status.style.color = '#ff6b6b'; status.textContent = '提取失败：' + e.message; }
    }
    if (btn) btn.disabled = false;
  }

  function getSessions() {
    return JSON.parse(localStorage.getItem(SESSIONS_KEY) || '[]');
  }
  function collectAllMessagesChronological() {
    return getSessions()
      .flatMap(session => {
        const messages = Array.isArray(session.messages) ? session.messages : [];
        const fallbackTime = Number(session.created_at || session.id || 0);
        return messages.map((message, index) => ({
          ...message,
          _sort_ts: Number(message.timestamp || fallbackTime + index),
        }));
      })
      .sort((a, b) => a._sort_ts - b._sort_ts)
      .map(({ _sort_ts, ...message }) => message);
  }
  function saveSessions(sessions) {
    localStorage.setItem(SESSIONS_KEY, JSON.stringify(sessions));
  }
  function sessionSortValue(session) {
    const messages = Array.isArray(session.messages) ? session.messages : [];
    const last = messages[messages.length - 1];
    return Number(last?.timestamp || session.created_at || session.id || 0);
  }
  function isNewerSession(a, b) {
    const aMessages = Array.isArray(a.messages) ? a.messages : [];
    const bMessages = Array.isArray(b.messages) ? b.messages : [];
    const aTime = sessionSortValue(a);
    const bTime = sessionSortValue(b);
    if (aTime !== bTime) return aTime > bTime;
    return aMessages.length > bMessages.length;
  }
  function mergeUnreadState(session, other) {
    const sessionUnreadUpdated = Number(session.unread_updated_at || 0);
    const otherUnreadUpdated = Number(other.unread_updated_at || 0);
    if (otherUnreadUpdated > sessionUnreadUpdated) {
      return {
        ...session,
        unread_count: Number(other.unread_count || 0),
        unread_updated_at: otherUnreadUpdated,
      };
    }
    if (otherUnreadUpdated === sessionUnreadUpdated && Number(other.unread_count || 0) > Number(session.unread_count || 0)) {
      return {
        ...session,
        unread_count: Number(other.unread_count || 0),
      };
    }
    return session;
  }
  function mergeSessionState(base, incoming) {
    if (!base) return incoming;
    if (isNewerSession(incoming, base)) return mergeUnreadState(incoming, base);
    return mergeUnreadState(base, incoming);
  }
  function mergeSessions(localSessions = [], cloudSessions = []) {
    const byId = new Map();
    [...cloudSessions, ...localSessions].forEach(session => {
      if (!session?.id) return;
      const prev = byId.get(session.id);
      byId.set(session.id, mergeSessionState(prev, session));
    });
    return [...byId.values()].sort((a, b) => sessionSortValue(b) - sessionSortValue(a));
  }
  async function syncSessionsFromCloud({ writeBack = false, refreshCurrent = true } = {}) {
    const cloudSessions = await sbFetchSessions();
    if (!cloudSessions) return false;

    const localSessions = getSessions();
    const previousCurrent = localSessions.find(s => s.id === currentSessionId);
    const merged = mergeSessions(localSessions, cloudSessions);
    const nextCurrent = merged.find(s => s.id === currentSessionId);
    saveSessions(merged);
    renderSessionList();

    if (writeBack) {
      merged.forEach(session => {
        const cloud = cloudSessions.find(s => s.id === session.id);
        if (!cloud || isNewerSession(session, cloud)) sbUpsertSession(session);
      });
    }

    if (refreshCurrent && currentView === 'chat' && currentSessionId && !isLoading) {
      if (nextCurrent && (!previousCurrent || isNewerSession(nextCurrent, previousCurrent))) loadSession(currentSessionId);
    } else if (!currentSessionId && merged.length > 0) {
      loadSession(merged[0].id);
    }
    return true;
  }

  async function saveConfig(cfg) {

  async function syncConfigFromCloud() {
    const cfg = getConfig();
    const oldCfg = JSON.parse(localStorage.getItem('chat-config') || '{}');
    const local = Object.assign({}, oldCfg, cfg);
    const cloud = await sbFetchCloudConfig();
    if (!cloud) {
      if (local.base || local.model || local.system) await sbUpsertCloudConfig({ ...local, _updated_at: Number(local._updated_at || Date.now()) });
      return local;
    }

    const localUpdated = Number(local._updated_at || 0);
    const cloudUpdated = Number(cloud.updated_at || 0);
    if (cloudUpdated >= localUpdated) {
      const merged = {
        ...local,
        base: cloud.base || local.base || 'https://ai.aiclick.cc',
        model: normalizeModelName(cloud.model || local.model),
        thinking_enabled: cloud.thinking_enabled === undefined ? isThinkingEnabled(local) : !!cloud.thinking_enabled,
        thinking_budget: normalizeThinkingBudget(cloud.thinking_budget || local.thinking_budget),
        system: cloud.system || '',
        _updated_at: cloudUpdated,
      };
      saveConfigLocal(merged);
      applyConfigToForm(merged);
      return merged;
    }

    await sbUpsertCloudConfig(local);
    return local;
  }

  function urlBase64ToUint8Array(base64String) {
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const rawData = window.atob(base64);
    return Uint8Array.from([...rawData].map(char => char.charCodeAt(0)));
  }

  async function enablePushNotifications() {
    const btn = document.getElementById('push-enable-btn');
    if (btn) btn.disabled = true;
    try {
      if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) {
        setPushStatus('当前浏览器不支持推送通知', '#ff6b6b');
        return;
      }

      const permission = await Notification.requestPermission();
      if (permission !== 'granted') {
        setPushStatus('通知权限未开启', '#ff6b6b');
        return;
      }

      const registration = await navigator.serviceWorker.ready;
      const keyRes = await fetch('/api/push/public-key');
      const { publicKey } = await keyRes.json();
      let subscription = await registration.pushManager.getSubscription();
      if (!subscription) {
        subscription = await registration.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(publicKey),
        });
      }

      const res = await fetch('/api/push/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          subscription,
          device_id: getDeviceId(),
          device_name: getDeviceName(),
          user_agent: navigator.userAgent || '',
        }),
      });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error || '保存订阅失败');
      setPushStatus('通知已开启，这台设备会收到推送', '#4caf50');
    } catch (e) {
      setPushStatus('开启失败：' + e.message, '#ff6b6b');
    } finally {
      if (btn) btn.disabled = false;
    }
  }

  function loadSession(id) {
    currentView = 'chat';
    currentSessionId = id;
    markSessionRead(id);
    const session = getSession(id);
    if (!session) return;
    chatArea.innerHTML = '';
    if (session.messages.length === 0) {
      chatArea.appendChild(emptyState);
    } else {
      session.messages.forEach((m, i) => appendBubble(m.role, m.content, i, false, [], m.timestamp || null, m.thinking || ''));

    }

  // ── Truncate helpers ──
  function truncateAt(fromIdx) {
    const session = getSession(currentSessionId);
    const messages = (session.messages || []).slice(0, fromIdx);
    updateSession(currentSessionId, { messages });
    return messages;
  }

  function removeDomFrom(fromIdx) {
    chatArea.querySelectorAll('.msg-row[data-idx]').forEach(r => {
      if (parseInt(r.dataset.idx) >= fromIdx) r.remove();
    });
    if (!chatArea.querySelector('.msg-row')) chatArea.appendChild(emptyState);
  }

  // ── Append bubble ──
  function formatTime(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    const now = new Date();
    const isToday = d.toDateString() === now.toDateString();
    const hm = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
    if (isToday) return hm;
    const md = (d.getMonth()+1) + '/' + d.getDate();
    return md + ' ' + hm;
  }

  function appendBubble(role, content, msgIdx, isError = false, imageUrls = [], timestamp = null, thinking = '') {
    emptyState.remove();
    const row = document.createElement('div');
    row.className = `msg-row ${role}`;
    if (msgIdx >= 0) row.dataset.idx = msgIdx;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'assistant' ? '💖' : '你';

    const bubble = document.createElement('div');
    bubble.className = 'bubble' + (isError ? ' error' : '');
    const plainText = typeof content === 'string' ? content : '';
    const isShortText = plainText.trim().length > 0 && plainText.trim().length <= 8 && !plainText.includes('\n') && imageUrls.length === 0;
    if (isShortText) bubble.classList.add('short');
    if (imageUrls.length > 0) {
      const imgWrap = document.createElement('div');
      imgWrap.style.cssText = 'display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;';
      imageUrls.forEach(url => {
        const img = document.createElement('img');
        img.src = url;
        img.style.cssText = 'max-width:120px;max-height:120px;border-radius:6px;object-fit:cover;';
        imgWrap.appendChild(img);
      });
      bubble.appendChild(imgWrap);
    }
    if (role === 'assistant' && thinking) {
      const panel = document.createElement('div');
      panel.className = 'thinking-panel collapsed';

      const toggle = document.createElement('button');
      toggle.className = 'thinking-toggle';
      toggle.type = 'button';
      toggle.innerHTML = '<span>思考</span><span class="thinking-chevron">⌄</span>';
      toggle.addEventListener('click', () => panel.classList.toggle('collapsed'));

      const thinkingEl = document.createElement('div');
      thinkingEl.className = 'thinking-content';
      thinkingEl.textContent = thinking;

      panel.appendChild(toggle);
      panel.appendChild(thinkingEl);
      bubble.appendChild(panel);
    }

    const textEl = document.createElement('div');
    textEl.className = 'msg-text';
    textEl.textContent = content;
    bubble.appendChild(textEl);

    if (timestamp) {
      const timeEl = document.createElement('div');
      timeEl.className = 'msg-time';
      timeEl.textContent = formatTime(timestamp);
      bubble.appendChild(timeEl);
    }

    // action buttons (only for indexed messages)
    const actions = document.createElement('div');
    actions.className = 'msg-actions';

    if (msgIdx >= 0 && !isError) {
      if (role === 'user') {
        const editBtn = makeActionBtn('✏️', '编辑', () => startEdit(row, bubble, msgIdx));
        actions.appendChild(editBtn);
      }
      if (role === 'assistant') {
        const regenBtn = makeActionBtn('↩', '重新生成', () => regenMsg(msgIdx));
        actions.appendChild(regenBtn);
      }
      const delBtn = makeActionBtn('✕', '删除此条及之后', () => deleteMsg(msgIdx));
      delBtn.style.color = '#444';
      actions.appendChild(delBtn);
    }

    // layout: user row is row-reverse, so DOM order [actions, bubble, avatar] → visual [avatar, bubble, actions reversed]
    // for user: we want avatar right, bubble middle, actions left
    // DOM order for user (row-reverse): avatar, bubble, actions → visual: actions, bubble, avatar ✓
    // for assistant (normal): avatar, bubble, actions → visual: avatar, bubble, actions ✓
    row.appendChild(avatar);
    row.appendChild(bubble);
    row.appendChild(actions);

    chatArea.appendChild(row);
    chatArea.scrollTop = chatArea.scrollHeight;
    return bubble;
  }

  function makeActionBtn(icon, title, onClick) {
    const btn = document.createElement('button');
    btn.className = 'msg-action-btn';
    btn.title = title;
    btn.textContent = icon;
    btn.addEventListener('click', onClick);
    return btn;
  }

  // ── Inline edit ──
  function startEdit(row, bubble, msgIdx) {
    if (isLoading) return;
    const originalText = bubble.querySelector('.msg-text')?.textContent || '';

    const ta = document.createElement('textarea');
    ta.className = 'edit-textarea';
    ta.value = originalText;
    ta.rows = Math.max(2, Math.min(originalText.split('\n').length + 1, 8));

    const btns = document.createElement('div');
    btns.className = 'edit-btns';

    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'edit-cancel';
    cancelBtn.textContent = '取消';

    const confirmBtn = document.createElement('button');
    confirmBtn.className = 'edit-confirm';
    confirmBtn.textContent = '发送';

    btns.appendChild(cancelBtn);
    btns.appendChild(confirmBtn);

    const wrapper = document.createElement('div');
    wrapper.className = 'edit-wrapper';
    wrapper.appendChild(ta);
    wrapper.appendChild(btns);

    bubble.replaceWith(wrapper);
    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);

    cancelBtn.addEventListener('click', () => wrapper.replaceWith(bubble));

    confirmBtn.addEventListener('click', async () => {
      const newText = ta.value.trim();
      if (!newText) return;
      wrapper.replaceWith(bubble);
      await editAndResend(msgIdx, newText);
    });

    ta.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); confirmBtn.click(); }
      if (e.key === 'Escape') cancelBtn.click();
    });
  }

  // ── Message actions ──
  function deleteMsg(msgIdx) {
    if (isLoading) return;
    showConfirm('确认删除这条消息以及后面的对话？', () => {
      truncateAt(msgIdx);
      removeDomFrom(msgIdx);
    });
  }

  async function regenMsg(msgIdx) {
    if (isLoading) return;
    const messages = truncateAt(msgIdx);
    removeDomFrom(msgIdx);
    if (messages.length === 0) return;
    await callApi(messages);
  }

  async function editAndResend(msgIdx, newText) {
    if (isLoading) return;
    const session = getSession(currentSessionId);
    const originalTs = session?.messages?.[msgIdx]?.timestamp || Date.now();
    const messages = truncateAt(msgIdx);
    removeDomFrom(msgIdx);

    const newIdx = messages.length;
    appendBubble('user', newText, newIdx, false, [], originalTs);
    messages.push({ role: 'user', content: newText, timestamp: originalTs });
    updateSession(currentSessionId, { messages });
    await callApi(messages);
  }

  function buildThinkingConfig(model, enabled, budget) {
    if (!enabled) return null;
    const meta = getModelMeta(model);
    if (meta.thinking === 'unknown') return null;
    if (meta.thinking === 'budget') {
      return {
        type: 'enabled',
        budget_tokens: THINKING_BUDGETS[budget] || THINKING_BUDGETS.low,
        display: 'summarized',
      };
    }
    return { type: 'adaptive', display: 'summarized' };
  }

  function parseClaudeContent(content) {
    const blocks = Array.isArray(content) ? content : [];
    const text = [];
    const thinking = [];
    blocks.forEach(block => {
      if (!block) return;
      if (block.type === 'text' && block.text) text.push(block.text);
      if ((block.type === 'thinking' || block.type === 'redacted_thinking') && block.thinking) thinking.push(block.thinking);
      if (block.type === 'thinking' && block.summary) thinking.push(block.summary);
      if (block.type === 'thinking' && Array.isArray(block.summaries)) {
        block.summaries.forEach(item => {
          if (typeof item === 'string') thinking.push(item);
          else if (item?.text) thinking.push(item.text);
          else if (item?.summary) thinking.push(item.summary);
        });
      }
    });
    return {
      text: text.join('\n\n').trim(),
      thinking: thinking.join('\n\n').trim(),
    };
  }

  function shouldRetryWithoutThinking(data) {
    const msg = String(data?.error?.message || data?.message || JSON.stringify(data || '')).toLowerCase();
    return msg.includes('thinking') ||
      msg.includes('budget') ||
      msg.includes('unsupported') ||
      msg.includes('not support') ||
      msg.includes('invalid request') ||
      msg.includes('max_tokens');
  }

  // ── API call (shared) ──
  async function callApi(messages) {
    const cfg = getConfig();
    const oldCfg = JSON.parse(localStorage.getItem('chat-config') || '{}');
    const key = (cfg.key || oldCfg.key || document.getElementById('cfg-key').value || '').trim();
    const base = (cfg.base || oldCfg.base || document.getElementById('cfg-base').value || 'https://ai.aiclick.cc').trim();
    const model = normalizeModelName(cfg.model || document.getElementById('cfg-model').value);
    const thinkingEnabled = isThinkingEnabled(cfg);
    const thinkingBudget = normalizeThinkingBudget(cfg.thinking_budget);
    let system = cfg.system || document.getElementById('cfg-system').value || '';
    if (pinnedFiles.length > 0) {
      const filesContext = pinnedFiles.map(f => `【${f.name}】\n${f.content}`).join('\n\n---\n\n');
      system = system ? system + '\n\n以下是用户的固定文件，请在对话中参考：\n\n' + filesContext : '以下是用户的固定文件，请在对话中参考：\n\n' + filesContext;
    }
    if (memories.length > 0) {
      const memText = memories.map(m => `- ${m.content}`).join('\n');
      const memBlock = '【记忆库】以下是关于用户的重要信息，请在对话中自然地参考：\n' + memText;
      system = system ? system + '\n\n' + memBlock : memBlock;
    }
    if (preferences.length > 0) {
      const prefText = preferences.map(p => `- ${p.content}`).join('\n');
      const prefBlock = '【我的偏好】以下是我的兴趣爱好和想法：\n' + prefText;
      system = system ? system + '\n\n' + prefBlock : prefBlock;
    }
    // 注入环境信息到最前面（并行请求，失败静默）
    const envCtx = await getEnvContext();
    system = envCtx + '\n\n' + (system || '');
    if (thinkingEnabled) {
      system += '\n\n' + THINKING_STYLE_PROMPT;
    }

    if (!key) {
      appendBubble('assistant', '请先在设置里填写 API Key', -1, true);
      return;
    }

    isLoading = true;
    sendBtn.disabled = true;

    const typingRow = showTyping();

    try {
      const apiMessages = messages.slice(-80).map(({ role, content }) => ({ role, content }));
      const body = { model, max_tokens: 1024, messages: apiMessages };
      if (system) body.system = system;
      const thinkingConfig = buildThinkingConfig(model, thinkingEnabled, thinkingBudget);
      if (thinkingConfig) {
        body.thinking = thinkingConfig;
        body.max_tokens = Math.max(body.max_tokens, (THINKING_BUDGETS[thinkingBudget] || 1024) + 1024);
      }

      let res = await fetch('/api/chat', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': key,
          'anthropic-version': '2023-06-01',
          'x-base-url': base,
        },
        body: JSON.stringify(body),
      });
      let data = await res.json();

      if (thinkingConfig && (!res.ok || data.error) && shouldRetryWithoutThinking(data)) {
        const plainBody = { ...body };
        delete plainBody.thinking;
        plainBody.max_tokens = 1024;
        res = await fetch('/api/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': key,
            'anthropic-version': '2023-06-01',
            'x-base-url': base,
          },
          body: JSON.stringify(plainBody),
        });
        data = await res.json();
      }

      typingRow.remove();

      if (!res.ok || data.error) {
        const errMsg = data.error?.message || JSON.stringify(data);
        appendBubble('assistant', `出错了 (${res.status})：${errMsg}`, -1, true);
      } else {
        const parsed = parseClaudeContent(data.content);
        const reply = parsed.text || '';
        const session = getSession(currentSessionId);
        const msgs = session.messages || [];
        const assistantTs = Date.now();
        appendBubble('assistant', reply, msgs.length, false, [], assistantTs, parsed.thinking);
        msgs.push({ role: 'assistant', content: reply, thinking: parsed.thinking, timestamp: assistantTs });
        updateSession(currentSessionId, { messages: msgs });
        // 对话结束后异步提取偏好
        maybeExtractPreferences();
      }
    } catch (e) {
      typingRow.remove();
      appendBubble('assistant', '网络错误：' + e.message, -1, true);
    }

    isLoading = false;
    sendBtn.disabled = false;
  }

  function showTyping() {
    emptyState.remove();
    const row = document.createElement('div');
    row.className = 'msg-row assistant';
    row.id = 'typing-row';

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = '💖';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';

    row.appendChild(avatar);
    row.appendChild(bubble);
    chatArea.appendChild(row);

    return row;
  }

  // ── Send message ──
  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text || isLoading) return;

    const cfg = getConfig();
    const oldCfg = JSON.parse(localStorage.getItem('chat-config') || '{}');
    const key = cfg.key || oldCfg.key || document.getElementById('cfg-key').value;
    if (!key) {
      appendBubble('assistant', '请先在设置里填写 API Key', -1, true);
      return;
    }

    if (!currentSessionId) {
      const s = createSession();
      currentSessionId = s.id;
      renderSessionList();
    }
    if (currentView !== 'chat') loadSession(currentSessionId);

    userInput.value = '';
    autoResize();

    const session = getSession(currentSessionId);
    const messages = session.messages || [];
    const msgIdx = messages.length;

    // Build content (text + images)
    const images = [...pendingImages];
    clearImagePreviews();

    let userContent;
    if (images.length > 0) {
      userContent = [
        ...images.map(img => ({
          type: 'image',
          source: { type: 'base64', media_type: img.mediaType, data: img.base64 },
        })),
        { type: 'text', text },
      ];
    } else {
      userContent = text;
    }

    const userTs = Date.now();
    appendBubble('user', text, msgIdx, false, images.map(i => i.dataUrl), userTs);
    messages.push({ role: 'user', content: userContent, timestamp: userTs });

    if (messages.length === 1 && !session.title_locked) {
      updateSession(currentSessionId, { title: text.slice(0, 30), messages });
      renderSessionList();
    } else {
      updateSession(currentSessionId, { messages });
    }

    await callApi(messages);
  }

  // ── Image handling ──
  function addImageToPreview(base64, mediaType, dataUrl) {
    pendingImages.push({ base64, mediaType, dataUrl });
    const bar = document.getElementById('image-preview-bar');
    const thumb = document.createElement('div');
    thumb.className = 'img-thumb';
    const img = document.createElement('img');
    img.src = dataUrl;
    const removeBtn = document.createElement('button');
    removeBtn.className = 'img-thumb-remove';
    removeBtn.textContent = '×';
    const idx = pendingImages.length - 1;
    removeBtn.addEventListener('click', () => {
      pendingImages.splice(pendingImages.indexOf(pendingImages[idx]), 1);
      thumb.remove();
    });
    thumb.appendChild(img);
    thumb.appendChild(removeBtn);
    bar.appendChild(thumb);
  }

  function clearImagePreviews() {
    pendingImages = [];
    document.getElementById('image-preview-bar').innerHTML = '';
  }

    if (settingsPanel.classList.contains('open') &&
        !settingsPanel.contains(e.target) &&
        e.target !== document.getElementById('settings-btn')) {
      settingsPanel.classList.remove('open');
    }
  });

  // ── Document file upload ──
  document.getElementById('doc-file-input').addEventListener('change', async function(e) {
    const files = Array.from(e.target.files);
    const status = document.getElementById('doc-upload-status');
    status.style.color = '#888';
    status.textContent = '处理中…';
    for (const file of files) {
      try {
        const content = await extractTextFromFile(file);
        if (!content.trim()) { status.style.color = '#ff6b6b'; status.textContent = `${file.name} 无法提取文字`; continue; }
        const f = { id: Date.now().toString() + Math.random().toString(36).slice(2), name: file.name, content, created_at: Date.now() };
        pinnedFiles.push(f);
        await sbUpsertFile(f);
        renderFilesList();
        status.style.color = '#4caf50';
        status.textContent = `✓ ${file.name} 已添加`;
      } catch(err) {
        status.style.color = '#ff6b6b';
        status.textContent = `${file.name} 出错：${err.message}`;
      }
    }
    e.target.value = '';
  });

  // ── Attach image ──
  document.getElementById('attach-btn').addEventListener('click', () => {
    document.getElementById('file-input').click();
  });

  document.getElementById('file-input').addEventListener('change', function(e) {
    const files = Array.from(e.target.files);
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = ev => {
        const dataUrl = ev.target.result;
        const base64 = dataUrl.split(',')[1];
        addImageToPreview(base64, file.type, dataUrl);
      };
      reader.readAsDataURL(file);
    });
    e.target.value = '';
  });

  // ── Import session from JSON file ──
  document.getElementById('import-file').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const status = document.getElementById('import-status');
    status.style.color = '#888';
    status.textContent = '读取中…';
    const reader = new FileReader();
    reader.onload = function(ev) {
      try {
        const session = JSON.parse(ev.target.result);
        if (!session.id || !Array.isArray(session.messages)) {
          status.style.color = '#ff6b6b';
          status.textContent = '文件格式不对';
          return;
        }
        const sessions = getSessions();
        const idx = sessions.findIndex(s => s.id === session.id);
        if (idx >= 0) sessions.splice(idx, 1);
        sessions.unshift(session);
        saveSessions(sessions);
        sbUpsertSession(session);
        renderSessionList();
        status.style.color = '#4caf50';
        status.textContent = `✓ 导入成功，共 ${session.messages.length} 条消息`;
        setTimeout(() => { loadSession(session.id); }, 500);
      } catch(err) {
        status.style.color = '#ff6b6b';
        status.textContent = '解析失败：' + err.message;
      }
    };
    reader.readAsText(file);
  });

  init();

  // ── PWA Service Worker ──
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
