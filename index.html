<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Lucian</title>
  <link rel="icon" href="/icon.svg" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0f0f0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Lucian" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20260701" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0f0f;
      color: #e8e8e8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      height: 100dvh;
      display: flex;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: 240px;
      min-width: 240px;
      background: #141414;
      border-right: 1px solid #222;
      display: flex;
      flex-direction: column;
      transition: width 0.2s, min-width 0.2s;
      overflow: hidden;
    }
    #sidebar.collapsed { width: 0; min-width: 0; border-right: none; }

    #sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 14px;
      border-bottom: 1px solid #222;
      flex-shrink: 0;
    }
    #sidebar-header span { font-size: 18px; }
    #new-chat-btn {
      background: none;
      border: 1px solid #333;
      color: #e8e8e8;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }
    #new-chat-btn:hover { background: #222; }

    .sidebar-section {
      padding: 10px 8px 6px;
      border-bottom: 1px solid #202020;
    }
    .sidebar-label {
      font-size: 10px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: .08em;
      padding: 0 8px 6px;
    }
    .library-nav-item {
      width: 100%;
      background: none;
      border: none;
      color: #aaa;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 10px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      text-align: left;
    }
    .library-nav-item:hover { background: #1e1e1e; color: #e8e8e8; }
    .library-nav-item.active { background: #252525; color: #e8e8e8; }

    #session-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }
    #session-list::-webkit-scrollbar { width: 4px; }
    #session-list::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

    .session-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 14px;
      cursor: pointer;
      border-radius: 6px;
      margin: 2px 8px;
      gap: 6px;
    }
    .session-item:hover { background: #1e1e1e; }
    .session-item.active { background: #252525; }

    .session-title {
      flex: 1;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #ccc;
    }
    .session-item.active .session-title { color: #e8e8e8; }
    .session-unread {
      min-width: 17px;
      height: 17px;
      border-radius: 999px;
      background: #7a2424;
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 5px;
      font-size: 10px;
      line-height: 1;
      font-weight: 600;
      flex-shrink: 0;
    }

    .session-action {
      background: none;
      border: none;
      color: #555;
      cursor: pointer;
      font-size: 14px;
      padding: 2px 4px;
      border-radius: 3px;
      flex-shrink: 0;
      opacity: 0;
    }
    .session-item:hover .session-action { opacity: 1; }
    .session-rename:hover { color: #e8e8e8; background: #252525; }
    .session-delete:hover { color: #ff6b6b; background: #2a1a1a; }
    .session-memory-mode {
      border: 1px solid #333;
      background: #171717;
      color: #777;
      cursor: pointer;
      border-radius: 999px;
      font-size: 10px;
      line-height: 1;
      padding: 4px 7px;
      flex-shrink: 0;
      white-space: nowrap;
    }
    .session-memory-mode:hover { color: #ddd; border-color: #555; }
    .session-memory-mode.immersive { color: #d8b986; border-color: #5b4425; background: #211a10; }
    .session-memory-mode.off { color: #999; border-color: #444; background: #202020; }

    /* ── Main area ── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid #222;
      flex-shrink: 0;
    }
    #toggle-sidebar {
      background: none;
      border: none;
      color: #888;
      font-size: 18px;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
    }
    #toggle-sidebar:hover { color: #e8e8e8; background: #222; }

    header .logo { font-size: 20px; }

    #settings-btn {
      background: none;
      border: none;
      color: #888;
      font-size: 18px;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
    }
    #settings-btn:hover { color: #e8e8e8; background: #222; }

    /* ── Chat area ── */
    #chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    #chat-area::-webkit-scrollbar { width: 4px; }
    #chat-area::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

    #empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #444;
    }
    #empty-state .icon { font-size: 36px; }
    #empty-state p { font-size: 14px; }

    .msg-row {
      display: flex;
      gap: 6px;
      max-width: 720px;
      align-items: flex-end;
    }
    .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg-content {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-width: calc(100% - 90px);
      min-width: 44px;
    }
    .msg-row.user .msg-content { align-items: flex-end; }
    .msg-row.assistant .msg-content { align-items: flex-start; }

    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }
    .msg-row.assistant .avatar { background: #1e1e1e; }
    .msg-row.user .avatar { background: #2a2a2a; font-size: 11px; color: #aaa; }

    .bubble {
      background: #1a1a1a;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 14px;
      line-height: 1.6;
      max-width: 100%;
      width: auto;
      min-width: 44px;
      overflow-wrap: break-word;
      word-break: normal;
    }
    .bubble.short { min-width: max-content; }
    .msg-row.user .bubble { background: #212121; }
    .bubble.error { color: #ff6b6b; background: #1a0f0f; }
    .msg-text {
      white-space: pre-wrap;
      overflow-wrap: break-word;
      word-break: normal;
    }
    .bubble.short .msg-text { white-space: nowrap; }

    /* ── Message actions ── */
    .msg-actions {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
      flex-shrink: 0;
      min-height: 24px;
      padding: 2px 0 0;
    }
    .msg-row.actions-visible .msg-actions {
      opacity: 1;
      pointer-events: auto;
    }
    .msg-row.user .msg-actions { justify-content: flex-end; }
    .msg-row.assistant .msg-actions { justify-content: flex-start; }
    .msg-action-btn {
      background: transparent;
      border: none;
      color: #8f8b86;
      cursor: pointer;
      padding: 0;
      border-radius: 6px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      transition: color .15s ease, background .15s ease;
    }
    .msg-action-btn svg {
      width: 21px;
      height: 21px;
      stroke: currentColor;
      stroke-width: 1.8;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .msg-action-btn:hover {
      color: #e8e8e8;
      background: #1f1f1f;
    }
    .msg-action-delete { color: #77726d; }
    .msg-action-delete:hover {
      color: #ff6b6b;
      background: #211616;
    }

    /* ── Edit mode ── */
    .edit-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: min(560px, calc(100vw - 110px));
      max-width: calc(100% - 90px);
      background: #181818;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 10px;
    }
    .edit-textarea {
      background: #111;
      border: 1px solid #3a3a3a;
      border-radius: 10px;
      color: #e8e8e8;
      font-size: 14px;
      padding: 10px 14px;
      resize: none;
      outline: none;
      font-family: inherit;
      line-height: 1.6;
      width: 100%;
      min-height: 120px;
      max-height: 280px;
      overflow-y: auto;
    }
    .edit-btns { display: flex; gap: 6px; justify-content: flex-end; }
    .edit-cancel {
      background: #2a2a2a; border: none; color: #aaa;
      padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 13px;
    }
    .edit-confirm {
      background: #e8e8e8; border: none; color: #0f0f0f;
      padding: 4px 12px; border-radius: 6px; cursor: pointer;
      font-size: 13px; font-weight: 500;
    }

    .msg-time {
      font-size: 10px;
      color: #444;
      margin-top: 4px;
      text-align: right;
      user-select: none;
      line-height: 1;
    }
    .msg-row.assistant .msg-time { text-align: left; }
    .thought-process {
      width: 100%;
      color: #aaa;
      font-size: 12px;
      line-height: 1.55;
    }
    .thought-toggle {
      border: none;
      background: transparent;
      color: #aaa;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      line-height: 1.4;
      padding: 0;
      text-align: left;
      font-family: inherit;
      letter-spacing: 0;
    }
    .thought-toggle:hover { color: #e0e0e0; }
    .thought-chevron {
      color: #777;
      transition: transform .15s ease;
    }
    .thought-process.open .thought-chevron { transform: rotate(90deg); }
    .thought-content {
      color: #9a9a9a;
      font-size: 12px;
      line-height: 1.7;
      margin-top: 7px;
      padding-left: 12px;
      border-left: 1px solid #333;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      max-height: 220px;
      overflow-y: auto;
    }
    .thought-process.collapsed .thought-content { display: none; }
    .thought-process.mobile .thought-content { display: none; }
    .thought-sheet-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.48);
      z-index: 500;
    }
    .thought-sheet-overlay.visible { display: block; }
    .thought-sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: min(58vh, 520px);
      background: #151515;
      border-top: 1px solid #2a2a2a;
      border-radius: 16px 16px 0 0;
      transform: translateY(100%);
      transition: transform .2s ease;
      z-index: 501;
      display: flex;
      flex-direction: column;
      box-shadow: 0 -12px 32px rgba(0,0,0,.35);
    }
    .thought-sheet.open { transform: translateY(0); }
    .thought-sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      color: #cfcfcf;
      font-size: 14px;
      border-bottom: 1px solid #232323;
      flex-shrink: 0;
    }
    .thought-sheet-close {
      border: none;
      background: transparent;
      color: #777;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      padding: 2px 4px;
    }
    .thought-sheet-close:hover { color: #e8e8e8; }
    .thought-sheet-body {
      color: #aaa;
      font-size: 13px;
      line-height: 1.75;
      padding: 16px 18px 24px;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      overflow-y: auto;
    }

    .typing-dots {
      display: flex;
      gap: 4px;
      padding: 4px 0;
    }
    .typing-dots span {
      width: 6px; height: 6px;
      background: #555;
      border-radius: 50%;
      animation: dot 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dot { 0%,80%,100%{opacity:.2} 40%{opacity:1} }

    /* ── Input ── */
    #input-bar {
      padding: 14px 20px;
      border-top: 1px solid #1e1e1e;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }
    #input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    #attach-btn {
      background: none;
      border: none;
      color: #666;
      font-size: 18px;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
      flex-shrink: 0;
      height: 36px;
      display: flex;
      align-items: center;
    }
    #attach-btn:hover { color: #e8e8e8; }
    #image-preview-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .img-thumb {
      position: relative;
      width: 60px;
      height: 60px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #333;
      flex-shrink: 0;
    }
    .img-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .file-thumb {
      position: relative;
      min-width: 120px;
      max-width: 220px;
      min-height: 44px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #171717;
      color: #cfcfcf;
      font-size: 12px;
      line-height: 1.35;
      padding: 8px 28px 8px 10px;
      display: flex;
      align-items: center;
      overflow: hidden;
    }
    .file-thumb-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .file-thumb-meta {
      color: #666;
      font-size: 10px;
      margin-left: 6px;
      flex-shrink: 0;
    }
    .img-thumb-remove {
      position: absolute;
      top: 2px; right: 2px;
      background: rgba(0,0,0,0.7);
      border: none;
      color: #fff;
      font-size: 11px;
      border-radius: 50%;
      width: 16px; height: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    #user-input {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      color: #e8e8e8;
      font-size: 14px;
      padding: 8px 14px;
      resize: none;
      outline: none;
      font-family: inherit;
      min-height: 36px;
      max-height: 160px;
      line-height: 1.5;
      box-sizing: border-box;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #3a3a3a transparent;
    }
    #user-input::-webkit-scrollbar { width: 4px; }
    #user-input::-webkit-scrollbar-track { background: transparent; }
    #user-input::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 999px; }
    #user-input:focus { border-color: #3a3a3a; }
    #user-input::placeholder { color: #444; }

    #send-btn {
      background: #e8e8e8;
      border: none;
      color: #0f0f0f;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #send-btn:hover { background: #fff; }
    #send-btn:disabled { background: #333; color: #666; cursor: not-allowed; }

    /* ── Settings panel ── */
    #settings-panel {
      display: none;
      position: fixed;
      top: 0; right: 0;
      width: 320px;
      height: 100%;
      background: #141414;
      border-left: 1px solid #222;
      padding: 24px 20px;
      flex-direction: column;
      gap: 16px;
      z-index: 100;
      overflow-y: auto;
    }
    #settings-panel.open { display: flex; }

    .settings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 4px;
    }
    .settings-title {
      font-size: 15px;
      font-weight: 500;
      color: #e8e8e8;
    }
    #close-settings {
      width: 30px;
      height: 30px;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      background: #1a1a1a;
      color: #aaa;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    #close-settings:hover { color: #e8e8e8; background: #222; }
    .setting-row { display: flex; flex-direction: column; gap: 6px; }
    .setting-row label { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 0.05em; }

    .setting-row input,
    .setting-row select,
    .setting-row textarea {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      color: #e8e8e8;
      font-size: 13px;
      padding: 8px 12px;
      outline: none;
      font-family: inherit;
      width: 100%;
    }
    .setting-row textarea { resize: vertical; min-height: 80px; }
    .setting-row input:focus,
    .setting-row select:focus,
    .setting-row textarea:focus { border-color: #3a3a3a; }
    .setting-row select option { background: #1a1a1a; }
    .setting-hint {
      color: #777;
      font-size: 12px;
      line-height: 1.5;
    }
    .model-info-card {
      border: 1px solid #272727;
      border-radius: 8px;
      background: #171717;
      padding: 10px 11px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .model-info-title {
      color: #e2e2e2;
      font-size: 13px;
      font-weight: 500;
    }
    .model-info-line {
      color: #898989;
      font-size: 12px;
      line-height: 1.5;
    }
    .model-info-line strong {
      color: #b5b5b5;
      font-weight: 500;
    }
    .settings-action-row select {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #333;
      color: #aaa;
      border-radius: 8px;
      padding: 9px 10px;
      font-size: 13px;
      outline: none;
      font-family: inherit;
    }

    #save-settings {
      background: #e8e8e8;
      color: #0f0f0f;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
      margin-top: 4px;
    }
    #save-settings:hover { background: #fff; }
    .settings-secondary-btn {
      background: #1a1a1a;
      border: 1px solid #333;
      color: #aaa;
      border-radius: 8px;
      padding: 9px 10px;
      font-size: 13px;
      cursor: pointer;
      text-align: center;
    }
    .settings-secondary-btn:hover { background: #222; color: #e8e8e8; }
    .settings-secondary-btn:disabled { color: #555; cursor: not-allowed; }
    .settings-action-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .load-older-btn {
      align-self: center;
      border: 1px solid #2a2a2a;
      background: #171717;
      color: #888;
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 12px;
      cursor: pointer;
      margin-bottom: 4px;
    }
    .load-older-btn:hover { background: #202020; color: #ddd; }

    /* ── Library pages ── */
    .library-page {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .library-page-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 14px;
      padding: 8px 0 6px;
      border-bottom: 1px solid #222;
    }
    .library-page-title {
      font-size: 20px;
      font-weight: 600;
      color: #e8e8e8;
      line-height: 1.2;
    }
    .library-page-subtitle {
      margin-top: 4px;
      font-size: 12px;
      color: #666;
      line-height: 1.5;
    }
    .library-page-meta {
      font-size: 11px;
      color: #555;
      white-space: nowrap;
    }
    .library-page-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: flex-end;
      flex-shrink: 0;
    }
    .library-list {
      display: flex;
      flex-direction: column;
      gap: 6px;

  let _cachedEnvContext = null;
  let _envContextExpiry = 0;

  const SB_FETCH_TIMEOUT_MS = 8000;

  function _fetchWithTimeout(url, ms, init = {}) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), ms);
    return fetch(url, { ...init, signal: ctrl.signal }).finally(() => clearTimeout(timer));
  }

  function _wmoToDesc(code) {
    const map = {
      0:'晴',1:'大部晴',2:'多云',3:'阴',
      45:'雾',48:'冻雾',
      51:'小毛毛雨',53:'毛毛雨',55:'大毛毛雨',
      61:'小雨',63:'中雨',65:'大雨',
      71:'小雪',73:'中雪',75:'大雪',77:'冰粒',
      80:'阵雨',81:'大阵雨',82:'强阵雨',85:'阵雪',86:'大阵雪',
      95:'雷雨',96:'雷雨夹冰雹',99:'强雷雨夹冰雹',
    };
    return map[code] || '未知';
  }

  async function getEnvContext() {
    const now = Date.now();
    if (_cachedEnvContext && now < _envContextExpiry) return _cachedEnvContext;

    const d = new Date();
    const weekDays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
    const timeStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} ${weekDays[d.getDay()]}`;

    let city = '';
    let weather = '';

    try {
      const [geoResult] = await Promise.allSettled([
        _fetchWithTimeout('https://ipapi.co/json/', 5000)
      ]);

      if (geoResult.status === 'fulfilled' && geoResult.value.ok) {
        const geo = await geoResult.value.json();
        city = geo.city || geo.region || '';

        if (geo.latitude && geo.longitude) {
          try {
            const wRes = await _fetchWithTimeout(
              `https://api.open-meteo.com/v1/forecast?latitude=${geo.latitude}&longitude=${geo.longitude}&current=temperature_2m,weathercode&timezone=auto`,
              5000
            );
            if (wRes.ok) {
              const wData = await wRes.json();
              const temp = Math.round(wData.current?.temperature_2m ?? 0);
              const desc = _wmoToDesc(wData.current?.weathercode);
              weather = `${desc}，${temp}°C`;
            }
          } catch {}
        }
      }
    } catch {}

    const parts = [`时间：${timeStr}`];
    if (city) parts.push(`城市：${city}`);
    if (weather) parts.push(`天气：${weather}`);
    _cachedEnvContext = `【当前环境】${parts.join(' | ')}`;
    _envContextExpiry = now + 30 * 60 * 1000;
    return _cachedEnvContext;
  }

  async function extractPreferences(allMessages) {
    const btn = document.getElementById('pref-extract-btn');
    const status = document.getElementById('pref-status');
    if (btn) btn.disabled = true;
    if (status) { status.style.color = '#888'; status.textContent = '正在分析偏好…'; }

    const cfg = getConfig();
    const oldCfg = JSON.parse(localStorage.getItem('chat-config') || '{}');
    const key = (cfg.key || oldCfg.key || document.getElementById('cfg-key').value || '').trim();
    const base = (cfg.base || oldCfg.base || document.getElementById('cfg-base').value || 'https://ai.aiclick.cc').trim();

    if (!key) {
      if (status) { status.style.color = '#ff6b6b'; status.textContent = '需要 API Key'; }
      if (btn) btn.disabled = false;
      return;
    }

    const recent = allMessages.slice(-240);
    const dialogText = recent
      .filter(m => m.role === 'assistant')
      .map(m => typeof m.content === 'string' ? m.content : '')
      .filter(Boolean)
      .join('\n')
      .slice(-6000);

    if (!dialogText.trim()) {
      if (status) { status.style.color = '#666'; status.textContent = '暂无 AI 回复可分析'; }
      if (btn) btn.disabled = false;
      return;
    }

    const extractPrompt = `请从以下 AI 的回复中提取 AI 表达过的兴趣、爱好、看法和感受（即 AI 说"我"时表达的偏好）。

规则：
- 每条偏好一行，格式：[类别] 偏好内容
- 类别分四种：hobby（爱好/兴趣）、opinion（看法/观点）、habit（习惯倾向）、feeling（情感偏好）
- 只提取明确表达的偏好，最多8条
- 如果没有，返回：无

AI 回复内容：
${dialogText}

请直接输出列表，格式：[hobby] 内容 或 [opinion] 内容 等`;

    try {
      const { res, data } = await fetchChatJson({
        key,
        base,
        body: {
          model: EXTRACTION_MODEL,
          max_tokens: 512,
          messages: [{ role: 'user', content: extractPrompt }],
        },
      });
      if (!res.ok || data.error) throw new Error(data.error?.message || 'API error');

      const text = data.content?.[0]?.text || '';
      if (text.trim() === '无' || !text.trim()) {
        if (status) { status.style.color = '#666'; status.textContent = '暂无新偏好'; }
        if (btn) btn.disabled = false;
        return;
      }

      const validCats = ['hobby','opinion','habit','feeling'];
      const lines = text.split('\n').filter(l => validCats.some(c => l.includes(`[${c}]`)));
      let added = 0;
      for (const line of lines) {
        const catMatch = line.match(/\[(hobby|opinion|habit|feeling)\]/);
        if (!catMatch) continue;
        const category = catMatch[1];
        const content = line.replace(/\[.*?\]/g, '').trim();
        if (!content) continue;
        if (preferences.some(p => p.content === content)) continue;
        const pref = {
          id: Date.now().toString() + Math.random().toString(36).slice(2),
          content,
          category,
          created_at: new Date().toISOString(),
          updated_at: new Date().toISOString(),
        };
        preferences.push(pref);
        await sbUpsertPreference(pref);
        added++;
      }
      localStorage.setItem('lc-preferences', JSON.stringify(preferences));
      if (status) { status.style.color = '#4caf50'; status.textContent = added > 0 ? `✓ 新增 ${added} 条偏好` : '✓ 偏好已是最新'; }
      renderPreferenceList();
    } catch(e) {
      if (status) { status.style.color = '#ff6b6b'; status.textContent = '提取失败：' + e.message; }
    }
    if (btn) btn.disabled = false;
  }

  async function extractTextFromFile(file) {
    const ext = file.name.split('.').pop().toLowerCase();
    if (ext === 'txt' || ext === 'md') {
      return new Promise(resolve => {
        const r = new FileReader();
        r.onload = e => resolve(e.target.result);
        r.readAsText(file);
      });
    }
    if (ext === 'pdf') {
      // Use PDF.js from CDN
      if (!window.pdfjsLib) {
        await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      }
      const ab = await file.arrayBuffer();
      const pdf = await window.pdfjsLib.getDocument({ data: ab }).promise;
      let text = '';
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        text += content.items.map(s => s.str).join(' ') + '\n';
      }
      return text;
    }
    if (ext === 'docx') {
      if (!window.mammoth) {
        await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js');
      }
      const ab = await file.arrayBuffer();
      const result = await window.mammoth.extractRawText({ arrayBuffer: ab });
      return result.value;
    }
    return '';
  }

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = reject;
      document.head.appendChild(s);
    });
  }

  async function extractMemories(allMessages) {
    const btn = document.getElementById('memory-extract-btn');
    const status = document.getElementById('memory-status');
    if (btn) btn.disabled = true;
    if (status) { status.style.color = '#888'; status.textContent = '正在提取记忆…'; }

    const cfg = getConfig();
    const oldCfg = JSON.parse(localStorage.getItem('chat-config') || '{}');

    const base = (cfg.base || oldCfg.base || document.getElementById('cfg-base').value || 'https://ai.aiclick.cc').trim();

    if (!key) {
      if (status) { status.style.color = '#ff6b6b'; status.textContent = '需要 API Key'; }
      if (btn) btn.disabled = false;
      return;
    }

    const recent = allMessages.slice(-400);
    const dialogText = recent
      .map(m => `${m.role === 'user' ? '用户' : 'AI'}: ${typeof m.content === 'string' ? m.content : '[图片]'}`)
      .join('\n')
      .slice(-20000);

    const extractPrompt = `请从以下对话记录中提取重要的记忆条目，用于未来对话中了解用户。

规则：
- 每条记忆一行，格式：[重要性] 记忆内容
- 重要性分两级：high（永久保存，如姓名、生日、重要偏好）或 low（一般信息，7天后遗忘）
- 只提取真正有价值的信息，最多10条
- 如果没有值得记录的信息，返回：无

对话记录：
${dialogText}

请直接输出记忆列表，每行格式：[high] 内容 或 [low] 内容`;

    try {
      const { res, data } = await fetchChatJson({
        key,
        base,
        body: {
          model: EXTRACTION_MODEL,
          max_tokens: 512,
          messages: [{ role: 'user', content: extractPrompt }],
        },
      });
      if (!res.ok || data.error) throw new Error(data.error?.message || 'API error');

      const text = data.content?.[0]?.text || '';
      if (text.trim() === '无' || !text.trim()) {
        localStorage.setItem('last_memory_extract', Date.now().toString());
        localStorage.setItem('last_memory_extract_message_count', allMessages.length.toString());

        if (!content) continue;
        if (memories.some(m => m.content === content)) continue;
        const item = {

  async function uploadAllLocalSessionsToCloud() {

    const cloudSessions = await sbFetchSessions();
    if (!cloudSessions) {
      setSessionSyncState({ state: 'error', local: getSessions().length, cloud: null, pending: getPendingSessionSyncIds().length });
      return false;
    }

    const localSessions = getSessions();
    const previousCurrent = localSessions.find(s => s.id === currentSessionId);
    const merged = mergeSessions(localSessions, cloudSessions);
    const nextCurrent = merged.find(s => s.id === currentSessionId);
    saveSessions(merged);
    renderSessionList();

    if (writeBack) {
      merged.forEach(session => {
        const cloud = cloudSessions.find(s => s.id === session.id);

  function urlBase64ToUint8Array(base64String) {

  async function enablePushNotifications() {
    const btn = document.getElementById('push-enable-btn');
    if (btn) btn.disabled = true;
    try {
      if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) {
        setPushStatus('当前浏览器不支持推送通知', '#ff6b6b');
        return;
      }

      const permission = await Notification.requestPermission();
      if (permission !== 'granted') {
        setPushStatus('通知权限未开启', '#ff6b6b');
        return;
      }

      const registration = await navigator.serviceWorker.ready;
      const keyRes = await fetch('/api/push/public-key');
      const { publicKey } = await keyRes.json();
      let subscription = await registration.pushManager.getSubscription();
      if (!subscription) {
        subscription = await registration.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(publicKey),
        });
      }

      const res = await fetch('/api/push/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          subscription,
          device_id: getDeviceId(),
          device_name: getDeviceName(),
          user_agent: navigator.userAgent || '',
        }),
      });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error || '保存订阅失败');
      setPushStatus('通知已开启，这台设备会收到推送', '#4caf50');
    } catch (e) {
      setPushStatus('开启失败：' + e.message, '#ff6b6b');
    } finally {
      if (btn) btn.disabled = false;
    }
  }

  function getContentText(content) {
    if (typeof content === 'string') return content;
    if (!Array.isArray(content)) return '';
    return content
      .map(block => {
        if (!block) return '';
        if (block.type === 'text') return block.text || '';
        if (block.type === 'document') return block.text || '';
        return '';
      })
      .filter(Boolean)
      .join('\n\n');
  }

  function getContentImageUrls(content) {
    if (!Array.isArray(content)) return [];
    return content
      .filter(block => block?.type === 'image' && block.source)
      .map(block => {
        const source = block.source;
        if (source.type === 'base64' && source.data) {
          return `data:${source.media_type || 'image/jpeg'};base64,${source.data}`;
        }
        if (source.type === 'url') return source.url || '';
        return '';
      })
      .filter(Boolean);
  }

  function contentHasImages(content) {
    return Array.isArray(content) && content.some(block => block?.type === 'image');
  }

  function normalizeApiContent(content, keepImages) {
    if (typeof content === 'string') return content;
    if (!Array.isArray(content)) return '';
    const blocks = [];
    let omittedImages = 0;
    content.forEach(block => {
      if (!block) return;
      if (block.type === 'text') {
        blocks.push({ type: 'text', text: block.text || '' });
      } else if (block.type === 'image') {
        if (keepImages) blocks.push(block);
        else omittedImages++;
      }
    });
    if (omittedImages > 0) {
      blocks.push({ type: 'text', text: `【之前发送过 ${omittedImages} 张图片，当前轮不重复上传原图。】` });
    }
    if (blocks.length === 1 && blocks[0].type === 'text') return blocks[0].text;
    return blocks;
  }

  function buildApiMessages(messages) {
    const recent = messages.slice(-RECENT_CONTEXT_MESSAGE_COUNT);
    let lastImageMessageIndex = -1;
    for (let i = recent.length - 1; i >= 0; i--) {
      if (recent[i]?.role === 'user' && contentHasImages(recent[i].content)) {
        lastImageMessageIndex = i;
        break;
      }
    }
    return recent.map((message, index) => ({
      role: message.role,
      content: normalizeApiContent(message.content, index === lastImageMessageIndex),
    }));
  }

  function buildWindowSummaryBlock(session) {
    const summary = String(session?.summary || '').trim();
    if (!summary) return '';
    return `【当前聊天窗口长期摘要】
以下是这个窗口较早对话压缩后的长期背景。它不是新消息，而是为了保持连续性：
${summary}`;
  }

  function formatMessageForSummary(message) {
    const role = message.role === 'assistant' ? '黎川' : '小雨';
    const text = getContentText(message.content).trim();
    const imageCount = getContentImageUrls(message.content).length;
    const parts = [];
    if (text) parts.push(text);
    if (imageCount > 0) parts.push(`【${imageCount}张图片】`);
    return `${role}: ${parts.join('\n') || '【空消息】'}`;
  }

  function trimSummarySourceText(text) {
    if (text.length <= SUMMARY_SOURCE_CHARS) return text;
    const headLen = Math.floor(SUMMARY_SOURCE_CHARS * 0.45);
    const tailLen = SUMMARY_SOURCE_CHARS - headLen;
    return text.slice(0, headLen) +
      '\n\n【中间有一段较长旧对话被省略，请根据前后内容提取稳定事实，不要编造。】\n\n' +
      text.slice(-tailLen);
  }

  function getSummaryRange(session) {
    const messages = Array.isArray(session?.messages) ? session.messages : [];
    const coveredUntil = Number(session.summary_until_index || 0);
    const targetUntil = Math.max(0, messages.length - RECENT_CONTEXT_MESSAGE_COUNT);
    if (targetUntil <= coveredUntil) return null;
    if (targetUntil - coveredUntil < SUMMARY_AUTO_MESSAGE_THRESHOLD) return null;
    return { coveredUntil, targetUntil, messages: messages.slice(coveredUntil, targetUntil) };
  }

    renderSessionMessages(session, Math.max(0, (session.messages || []).length - MESSAGE_BATCH_SIZE), false);

  function renderSessionMessages(session, startIndex = 0, preserveScroll = false) {
    activeActionMessageKey = null;
    const messages = session.messages || [];
    const previousHeight = chatArea.scrollHeight;
    const previousTop = chatArea.scrollTop;
    chatArea.innerHTML = '';
    if (messages.length === 0) {
      chatArea.appendChild(emptyState);
    } else {
      if (startIndex > 0) {
        const olderBtn = document.createElement('button');
        olderBtn.className = 'load-older-btn';
        olderBtn.type = 'button';
        const nextStart = Math.max(0, startIndex - MESSAGE_BATCH_SIZE);
        olderBtn.textContent = `加载更早消息（还有 ${startIndex} 条）`;
        olderBtn.addEventListener('click', () => renderSessionMessages(session, nextStart, true));
        chatArea.appendChild(olderBtn);
      }
      messages.slice(startIndex).forEach((m, offset) => {
        const i = startIndex + offset;
        appendBubble(m.role, m.content, i, false, getContentImageUrls(m.content), m.timestamp || null, m.thinking || '', false);
      });
      if (preserveScroll) chatArea.scrollTop = chatArea.scrollHeight - previousHeight + previousTop;
      else chatArea.scrollTop = chatArea.scrollHeight;
    }

  // ── Truncate helpers ──
  function truncateAt(fromIdx) {
    const session = getSession(currentSessionId);
    const messages = (session.messages || []).slice(0, fromIdx);
    const patch = { messages };
    if (Number(session.summary_until_index || 0) > messages.length) {
      patch.summary = '';
      patch.summary_until_index = 0;
      patch.summary_updated_at = Date.now();
      sbDeleteSessionSummary(currentSessionId);
    }
    updateSession(currentSessionId, patch);
    return messages;
  }

  function removeDomFrom(fromIdx) {
    chatArea.querySelectorAll('.msg-row[data-idx]').forEach(r => {
      if (parseInt(r.dataset.idx) >= fromIdx) r.remove();
    });
    if (!chatArea.querySelector('.msg-row')) chatArea.appendChild(emptyState);
  }

  // ── Append bubble ──
  function formatTime(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    const now = new Date();
    const isToday = d.toDateString() === now.toDateString();
    const hm = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
    if (isToday) return hm;
    const md = (d.getMonth()+1) + '/' + d.getDate();
    return md + ' ' + hm;
  }

  function isMobileViewport() {
    return window.matchMedia('(max-width: 600px)').matches;
  }

  function createThoughtProcess(thinking) {
    const panel = document.createElement('div');
    panel.className = 'thought-process collapsed' + (isMobileViewport() ? ' mobile' : '');

    const toggle = document.createElement('button');
    toggle.className = 'thought-toggle';
    toggle.type = 'button';
    toggle.innerHTML = '<span>✦ Thought process</span><span class="thought-chevron">›</span>';

    const thinkingEl = document.createElement('div');
    thinkingEl.className = 'thought-content';
    thinkingEl.textContent = thinking;

    toggle.addEventListener('click', () => {
      if (isMobileViewport()) {
        openThoughtSheet(thinking);
        return;
      }
      panel.classList.toggle('collapsed');
      panel.classList.toggle('open', !panel.classList.contains('collapsed'));
    });

    panel.appendChild(toggle);
    panel.appendChild(thinkingEl);
    return panel;
  }

    const overlay = document.getElementById('thought-sheet-overlay');
    const sheet = document.getElementById('thought-sheet');
    const body = document.getElementById('thought-sheet-body');
    body.textContent = thinking;
    overlay.classList.add('visible');
    sheet.classList.add('open');
    sheet.setAttribute('aria-hidden', 'false');

  function closeThoughtSheet() {
    const overlay = document.getElementById('thought-sheet-overlay');
    const sheet = document.getElementById('thought-sheet');
    overlay.classList.remove('visible');
    sheet.classList.remove('open');
    sheet.setAttribute('aria-hidden', 'true');

  function appendBubble(role, content, msgIdx, isError = false, imageUrls = [], timestamp = null, thinking = '', scrollToBottom = true) {
    const displayText = getContentText(content);
    const displayImages = imageUrls.length > 0 ? imageUrls : getContentImageUrls(content);
    emptyState.remove();
    const row = document.createElement('div');
    row.className = `msg-row ${role}`;
    if (msgIdx >= 0) row.dataset.idx = msgIdx;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'assistant' ? '💖' : '你';

    const bubble = document.createElement('div');
    bubble.className = 'bubble' + (isError ? ' error' : '');
    const contentWrap = document.createElement('div');
    contentWrap.className = 'msg-content';
    const plainText = displayText;
    const isShortText = plainText.trim().length > 0 && plainText.trim().length <= 8 && !plainText.includes('\n') && displayImages.length === 0;
    if (isShortText) bubble.classList.add('short');
    if (displayImages.length > 0) {
      const imgWrap = document.createElement('div');
      imgWrap.style.cssText = 'display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;';
      displayImages.forEach(url => {
        const img = document.createElement('img');
        img.src = url;
        img.style.cssText = 'max-width:120px;max-height:120px;border-radius:6px;object-fit:cover;';
        imgWrap.appendChild(img);
      });
      bubble.appendChild(imgWrap);
    }
    const textEl = document.createElement('div');
    textEl.className = 'msg-text';
    textEl.textContent = displayText;
    if (displayText) bubble.appendChild(textEl);

    if (timestamp) {
      const timeEl = document.createElement('div');
      timeEl.className = 'msg-time';
      timeEl.textContent = formatTime(timestamp);
      bubble.appendChild(timeEl);
    }

    // action buttons (only for indexed messages)
    const actions = document.createElement('div');
    actions.className = 'msg-actions';

    if (msgIdx >= 0 && !isError) {
      if (role === 'user') {
        const editBtn = makeActionBtn('edit', '编辑', () => startEdit(row, bubble, msgIdx));
        actions.appendChild(editBtn);
      } else {
        const regenBtn = makeActionBtn('regen', '重新生成', () => regenMsg(msgIdx));
        actions.appendChild(regenBtn);
      }
      const delBtn = makeActionBtn('delete', '删除此条及之后', () => deleteMsg(msgIdx));
      actions.appendChild(delBtn);
    }

    row.appendChild(avatar);
    if (role === 'assistant' && thinking) contentWrap.appendChild(createThoughtProcess(thinking));
    contentWrap.appendChild(bubble);
    contentWrap.appendChild(actions);
    row.appendChild(contentWrap);

    if (msgIdx >= 0 && !isError) {
      const actionKey = `${currentSessionId || 'local'}:${msgIdx}`;
      row.dataset.actionKey = actionKey;
      if (activeActionMessageKey === actionKey) row.classList.add('actions-visible');
      row.addEventListener('click', () => {
        activeActionMessageKey = activeActionMessageKey === actionKey ? null : actionKey;
        chatArea.querySelectorAll('.msg-row.actions-visible').forEach(item => item.classList.remove('actions-visible'));
        if (activeActionMessageKey === actionKey) row.classList.add('actions-visible');
      });
    }

    chatArea.appendChild(row);
    if (scrollToBottom) chatArea.scrollTop = chatArea.scrollHeight;
    return bubble;
  }

  // ── Inline edit ──
  function startEdit(row, bubble, msgIdx) {
    if (isLoading) return;
    const originalText = bubble.querySelector('.msg-text')?.textContent || '';

    const ta = document.createElement('textarea');
    ta.className = 'edit-textarea';
    ta.value = originalText;
    ta.rows = Math.max(2, Math.min(originalText.split('\n').length + 1, 8));
    const resizeEditTextarea = () => {
      ta.style.height = 'auto';
      ta.style.height = `${Math.max(120, Math.min(ta.scrollHeight, 280))}px`;
    };

    const btns = document.createElement('div');
    btns.className = 'edit-btns';

    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'edit-cancel';
    cancelBtn.textContent = '取消';

    const confirmBtn = document.createElement('button');
    confirmBtn.className = 'edit-confirm';
    confirmBtn.textContent = '发送';

    btns.appendChild(cancelBtn);
    btns.appendChild(confirmBtn);

    const wrapper = document.createElement('div');
    wrapper.className = 'edit-wrapper';
    wrapper.appendChild(ta);
    wrapper.appendChild(btns);

    bubble.replaceWith(wrapper);
    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);
    requestAnimationFrame(resizeEditTextarea);

    cancelBtn.addEventListener('click', () => wrapper.replaceWith(bubble));

    confirmBtn.addEventListener('click', async () => {
      const newText = ta.value.trim();
      if (!newText) return;
      wrapper.replaceWith(bubble);
      await editAndResend(msgIdx, newText);
    });

    ta.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); confirmBtn.click(); }
      if (e.key === 'Escape') cancelBtn.click();
    });
    ta.addEventListener('input', resizeEditTextarea);
  }

  // ── Message actions ──
  function deleteMsg(msgIdx) {
    if (isLoading) return;
    showConfirm('确认删除这条消息以及后面的对话？', () => {
      truncateAt(msgIdx);
      removeDomFrom(msgIdx);

  async function regenMsg(msgIdx) {
    if (isLoading) return;
    const messages = truncateAt(msgIdx);
    removeDomFrom(msgIdx);
    if (messages.length === 0) return;
    await callApi(messages);

  async function editAndResend(msgIdx, newText) {
    if (isLoading) return;
    const session = getSession(currentSessionId);
    const originalTs = session?.messages?.[msgIdx]?.timestamp || Date.now();
    const messages = truncateAt(msgIdx);
    removeDomFrom(msgIdx);

    const newIdx = messages.length;
    appendBubble('user', newText, newIdx, false, [], originalTs);
    messages.push({ role: 'user', content: newText, timestamp: originalTs });
    updateSession(currentSessionId, { messages });
    await callApi(messages);
  }

  function buildThinkingConfig(model, enabled, budget) {
    if (!enabled) return null;
    const meta = getModelMeta(model);
    if (meta.thinking === 'unknown') return null;
    if (meta.thinking === 'budget') {
      return {
        type: 'enabled',
        budget_tokens: THINKING_BUDGETS[budget] || THINKING_BUDGETS.low,
        display: 'summarized',
      };
    }
    return { type: 'adaptive', display: 'summarized' };
  }

  function collectTextFragments(value) {
    if (!value) return [];
    if (typeof value === 'string') return [value];
    if (Array.isArray(value)) return value.flatMap(collectTextFragments);
    if (typeof value === 'object') {
      return [
        ...collectTextFragments(value.text),
        ...collectTextFragments(value.content),
        ...collectTextFragments(value.summary),
        ...collectTextFragments(value.thinking),
      ];
    }
    return [];
  }

  function parseClaudeContent(content) {
    const blocks = Array.isArray(content) ? content : [];
    const text = [];
    const thinking = [];
    blocks.forEach(block => {
      if (!block) return;
      if (block.type === 'text' && block.text) text.push(block.text);
      if (['thinking', 'redacted_thinking', 'reasoning', 'summary'].includes(block.type)) {
        thinking.push(...collectTextFragments(block));
      }
    });
    return {
      text: text.join('\n\n').trim(),
      thinking: [...new Set(thinking.map(item => item.trim()).filter(Boolean))].join('\n\n').trim(),
    };
  }

  function shouldRetryWithoutThinking(data) {
    const msg = String(data?.error?.message || data?.message || JSON.stringify(data || '')).toLowerCase();
    return msg.includes('thinking') ||
      msg.includes('budget') ||
      msg.includes('unsupported') ||
      msg.includes('not support') ||
      msg.includes('invalid request') ||
      msg.includes('max_tokens');
  }

  function delay(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  function isRetryableChatFailure(res, data, err) {
    const msg = String(err?.message || data?.error?.message || data?.message || '').toLowerCase();
    if (err) return err.name === 'AbortError' || msg.includes('network') || msg.includes('failed') || msg.includes('timeout');
    if (!res) return false;
    return res.status === 408 || res.status === 429 || res.status >= 500 || msg.includes('timeout') || msg.includes('timed out');
  }

  function normalizeRawErrorText(text) {
    return String(text || '').replace(/\s+/g, ' ').trim().slice(0, 800);
  }

  async function readJsonOrError(res) {
    const raw = await res.text();
    if (!raw.trim()) return {};
    try {
      return JSON.parse(raw);
    } catch {
      return {
        error: {
          message: `返回内容不是 JSON：${normalizeRawErrorText(raw) || '空响应'}`,
          content_type: res.headers.get('content-type') || '',
        },
      };
    }
  }

  async function fetchChatJson({ key, base, body, retries = 1, timeoutMs = CHAT_REQUEST_TIMEOUT_MS }) {
    let lastErr = null;
    for (let attempt = 0; attempt <= retries; attempt++) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), timeoutMs);
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': key,
            'anthropic-version': '2023-06-01',
            'x-base-url': base,
          },
          body: JSON.stringify(body),
          signal: ctrl.signal,
        });
        clearTimeout(timer);
        const data = await readJsonOrError(res);
        if (attempt < retries && isRetryableChatFailure(res, data, null)) {
          await delay(CHAT_RETRY_DELAY_MS);
          continue;
        }
        return { res, data };
      } catch (err) {
        clearTimeout(timer);
        lastErr = err;
        if (attempt < retries && isRetryableChatFailure(null, null, err)) {
          await delay(CHAT_RETRY_DELAY_MS);
          continue;
        }
        throw err;
      }
    }
    throw lastErr || new Error('网络超时');
  }

  function applyStreamEventToBlocks(blocks, eventData) {
    if (!eventData || eventData === '[DONE]') return;
    let event;
    try { event = JSON.parse(eventData); } catch { return; }
    if (event.type === 'error') {
      throw new Error(event.error?.message || 'stream error');
    }
    if (event.type === 'content_block_start') {
      const index = Number(event.index || 0);
      blocks[index] = event.content_block || { type: 'text', text: '' };
      if (blocks[index].type === 'text' && blocks[index].text === undefined) blocks[index].text = '';
      if (blocks[index].type === 'thinking' && blocks[index].thinking === undefined) blocks[index].thinking = '';
      return;
    }
    if (event.type === 'content_block_delta') {
      const index = Number(event.index || 0);
      const delta = event.delta || {};
      if (!blocks[index]) blocks[index] = { type: 'text', text: '' };
      if (delta.type === 'text_delta') {
        blocks[index].type = blocks[index].type || 'text';
        blocks[index].text = (blocks[index].text || '') + (delta.text || '');
      } else if (delta.type === 'thinking_delta') {
        blocks[index].type = 'thinking';
        blocks[index].thinking = (blocks[index].thinking || '') + (delta.thinking || '');
      } else if (delta.type === 'summary_delta') {
        blocks[index].type = blocks[index].type || 'summary';
        blocks[index].text = (blocks[index].text || '') + (delta.summary || delta.text || '');
      } else if (delta.text || delta.summary || delta.thinking) {
        const isThoughtDelta = blocks[index]?.type === 'thinking' || blocks[index]?.type === 'summary' || delta.summary || delta.thinking;
        blocks[index].type = isThoughtDelta ? (blocks[index]?.type || 'summary') : 'text';
        const key = isThoughtDelta ? 'thinking' : 'text';
        blocks[index][key] = (blocks[index][key] || '') + (delta.thinking || delta.summary || delta.text || '');
      }
    }
  }

  async function readChatStream(res) {
    const contentType = res.headers.get('content-type') || '';
    if (!contentType.includes('text/event-stream')) {
      return await readJsonOrError(res);
    }

    const reader = res.body?.getReader();
    if (!reader) return { error: { message: 'Stream response has no body' } };
    const decoder = new TextDecoder();
    const blocks = [];
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (value) buffer += decoder.decode(value, { stream: !done });
      let boundary = buffer.indexOf('\n\n');
      while (boundary !== -1) {
        const rawEvent = buffer.slice(0, boundary);
        buffer = buffer.slice(boundary + 2);
        const dataLines = rawEvent
          .split('\n')
          .filter(line => line.startsWith('data:'))
          .map(line => line.slice(5).trimStart());
        if (dataLines.length > 0) applyStreamEventToBlocks(blocks, dataLines.join('\n'));
        boundary = buffer.indexOf('\n\n');
      }
      if (done) break;
    }

    if (buffer.trim()) {
      const dataLines = buffer
        .split('\n')
        .filter(line => line.startsWith('data:'))
        .map(line => line.slice(5).trimStart());
      if (dataLines.length > 0) applyStreamEventToBlocks(blocks, dataLines.join('\n'));
    }

    return { content: blocks.filter(Boolean) };
  }

  async function fetchChatStreamJson({ key, base, body, retries = 0, timeoutMs = CHAT_REQUEST_TIMEOUT_MS }) {
    const streamBody = { ...body, stream: true };
    let lastErr = null;
    for (let attempt = 0; attempt <= retries; attempt++) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), timeoutMs);
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': key,
            'anthropic-version': '2023-06-01',
            'x-base-url': base,
          },
          body: JSON.stringify(streamBody),
          signal: ctrl.signal,
        });
        const data = await readChatStream(res);
        clearTimeout(timer);
        if (attempt < retries && isRetryableChatFailure(res, data, null)) {
          await delay(CHAT_RETRY_DELAY_MS);
          continue;
        }
        return { res, data };
      } catch (err) {
        clearTimeout(timer);
        lastErr = err;
        if (attempt < retries && isRetryableChatFailure(null, null, err)) {
          await delay(CHAT_RETRY_DELAY_MS);
          continue;
        }
        throw err;
      }
    }
    throw lastErr || new Error('网络超时');
  }

  async function maybeSummarizeSessionInBackground(sessionId) {
    if (!sessionId || summarizingSessionIds.has(sessionId)) return;
    const session = getSession(sessionId);
    const range = getSummaryRange(session);
    if (!range) return;

    const cfg = getConfig();
    const oldCfg = JSON.parse(localStorage.getItem('chat-config') || '{}');
    const key = (cfg.key || oldCfg.key || document.getElementById('cfg-key').value || '').trim();
    const base = (cfg.base || oldCfg.base || document.getElementById('cfg-base').value || 'https://ai.aiclick.cc').trim();
    if (!key) return;

    summarizingSessionIds.add(sessionId);
    try {
      const previousSummary = String(session.summary || '').trim();
      const sourceText = trimSummarySourceText(range.messages.map(formatMessageForSummary).join('\n\n'));
      const prompt = `请为一个长期聊天窗口更新“窗口长期摘要”。这个摘要会在未来每次回复时作为背景使用。

要求：
- 只保留对未来对话有帮助的信息，不要流水账。
- 保留小雨和黎川之间的关系状态、重要事件、未完成话题、承诺、矛盾、情绪变化、称呼、边界、偏好、雷点。
- 保留具体事实，比如时间、地点、人物、工作/身体/生活状态、长期剧情线索。
- 不要把最近正在聊的即时上下文写得过细，因为最近 80 条原文会单独提供。
- 不要编造，不要评价，不要写成列表模板。
- 输出简体中文，控制在 ${SUMMARY_TARGET_CHARS} 字以内。

${previousSummary ? `已有旧摘要：\n${previousSummary}\n\n` : ''}需要并入摘要的旧对话：\n${sourceText}

请直接输出更新后的窗口长期摘要。`;

      const { res, data } = await fetchChatJson({
        key,
        base,
        retries: 0,
        body: {
          model: EXTRACTION_MODEL,
          max_tokens: 1400,
          messages: [{ role: 'user', content: prompt }],
        },
      });
      if (!res.ok || data.error) return;

      const text = (data.content?.[0]?.text || '').trim().slice(0, SUMMARY_TARGET_CHARS + 500);
      if (!text) return;
      const current = getSession(sessionId);
      if (!current) return;
      const nextPatch = {
        summary: text,
        summary_until_index: range.targetUntil,
        summary_updated_at: Date.now(),
      };
      updateSession(sessionId, nextPatch);
      const updated = getSession(sessionId);
      if (updated) await sbUpsertSessionSummary(updated);
    } catch {
      // 后台摘要失败不影响当前聊天。
    } finally {
      summarizingSessionIds.delete(sessionId);
    }
  }

  async function generateFallbackThinking({ key, base, model, userText, assistantText }) {
    if (!assistantText.trim()) return '';
    const prompt = `${THOUGHT_OS_PROMPT}

刚才接口没有返回 Thought process。根据小雨这一句和我已经发出的正文，补写一段自然的中文内心独白。

小雨：
${userText || '【无文字内容】'}

我已经发出的正文：
${assistantText}`;

    try {

  // ── API call (shared) ──
  async function callApi(messages) {
    const cfg = getConfig();
    const oldCfg = JSON.parse(localStorage.getItem('chat-config') || '{}');
    const key = (cfg.key || oldCfg.key || document.getElementById('cfg-key').value || '').trim();
    const base = (cfg.base || oldCfg.base || document.getElementById('cfg-base').value || 'https://ai.aiclick.cc').trim();
    const model = normalizeModelName(cfg.model || document.getElementById('cfg-model').value);
    const thinkingEnabled = isThinkingEnabled(cfg);
    const thinkingBudget = normalizeThinkingBudget(cfg.thinking_budget);
    let system = cfg.system || document.getElementById('cfg-system').value || '';
    const currentSessionForContext = getSession(currentSessionId);
    const memoryMode = normalizeMemoryMode(currentSessionForContext?.memory_mode);
    const summaryBlock = buildWindowSummaryBlock(currentSessionForContext);
    if (summaryBlock) {
      system = system ? system + '\n\n' + summaryBlock : summaryBlock;
    }
    if (pinnedFiles.length > 0) {
      const filesContext = pinnedFiles.map(f => `【${f.name}】\n${f.content}`).join('\n\n---\n\n');
      system = system ? system + '\n\n以下是用户的固定文件，请在对话中参考：\n\n' + filesContext : '以下是用户的固定文件，请在对话中参考：\n\n' + filesContext;
    }
    if (memoryMode !== 'off' && memories.length > 0) {
      const memText = memories.map(m => `- ${m.content}`).join('\n');
      const memIntro = memoryMode === 'immersive'
        ? '【记忆库】以下是关于小雨的长期现实信息。当前窗口处于沉浸模式，当前剧情和即时语境优先。不要主动提起不相关的现实事项，不要把求职、简历、投递、账号、项目等现实信息带进角色扮演；只有小雨明确把现实话题带进来时才参考：\n'
        : '【记忆库】以下是关于用户的重要信息，请在对话中自然地参考：\n';
      const memBlock = memIntro + memText;
      system = system ? system + '\n\n' + memBlock : memBlock;
    }
    if (memoryMode !== 'off' && preferences.length > 0) {
      const prefText = preferences.map(p => `- ${p.content}`).join('\n');
      const prefIntro = memoryMode === 'immersive'
        ? '【我的偏好】以下是黎川的长期偏好。当前窗口处于沉浸模式，只能作为隐藏背景，不要为了使用偏好而打断剧情和沉浸感：\n'
        : '【我的偏好】以下是我的兴趣爱好和想法：\n';
      const prefBlock = prefIntro + prefText;
      system = system ? system + '\n\n' + prefBlock : prefBlock;
    }
    // 注入环境信息到最前面（并行请求，失败静默）
    const envCtx = await getEnvContext();
    system = envCtx + '\n\n' + (system || '');
    const thinkingConfig = buildThinkingConfig(model, thinkingEnabled, thinkingBudget);
    if (thinkingConfig) {
      system += '\n\n' + THOUGHT_OS_PROMPT;
    }
    if (!key) {
      appendBubble('assistant', '请先在设置里填写 API Key', -1, true);
      return;
    }

    isLoading = true;
    sendBtn.disabled = true;

    const typingRow = showTyping();

    try {
      const apiMessages = buildApiMessages(messages);
      const body = { model, max_tokens: 1024, messages: apiMessages };
      if (system) body.system = system;
      if (thinkingConfig) {
        body.thinking = thinkingConfig;
        body.max_tokens = Math.max(body.max_tokens, (THINKING_BUDGETS[thinkingBudget] || THINKING_BUDGETS.low) + 1024);
      }

      let { res, data } = await fetchChatStreamJson({ key, base, body });

      if (thinkingConfig && (!res.ok || data.error) && shouldRetryWithoutThinking(data)) {
        const plainBody = { ...body };
        delete plainBody.thinking;
        plainBody.max_tokens = 1024;
        ({ res, data } = await fetchChatStreamJson({ key, base, body: plainBody }));
      }

      typingRow.remove();

      if (!res.ok || data.error) {
        const errMsg = data.error?.message || JSON.stringify(data);
        appendBubble('assistant', `出错了 (${res.status})：${errMsg}`, -1, true);
      } else {
        const parsed = parseClaudeContent(data.content);
        const reply = parsed.text || '';
        const lastUserMessage = [...messages].reverse().find(m => m.role === 'user');
        let thinking = parsed.thinking;
        if (thinkingConfig && !thinking) {
          thinking = await generateFallbackThinking({
            key,
            base,
            model,
            userText: getContentText(lastUserMessage?.content || ''),
            assistantText: reply,
          });
        }
        const session = getSession(currentSessionId);
        const msgs = session.messages || [];
        const assistantTs = Date.now();
        appendBubble('assistant', reply, msgs.length, false, [], assistantTs, thinking);
        msgs.push({ role: 'assistant', content: reply, thinking, timestamp: assistantTs });
        updateSession(currentSessionId, { messages: msgs });
        maybeSummarizeSessionInBackground(currentSessionId);
        // 对话结束后异步提取偏好
        maybeExtractPreferences();
      }
    } catch (e) {
      typingRow.remove();
      appendBubble('assistant', '网络错误：' + e.message, -1, true);
    }

    isLoading = false;
    sendBtn.disabled = false;
  }

  // ── Send message ──
  async function sendMessage() {
    const text = userInput.value.trim();
    if (isLoading) return;
    if (!text && pendingImages.length === 0 && pendingAttachments.length === 0) return;

    const cfg = getConfig();
    const oldCfg = JSON.parse(localStorage.getItem('chat-config') || '{}');
    const key = cfg.key || oldCfg.key || document.getElementById('cfg-key').value;
    if (!key) {
      appendBubble('assistant', '请先在设置里填写 API Key', -1, true);
      return;
    }

    if (!currentSessionId) {
      const s = createSession();
      currentSessionId = s.id;
      renderSessionList();
    }
    if (currentView !== 'chat') loadSession(currentSessionId);

    userInput.value = '';
    autoResize();

    const session = getSession(currentSessionId);
    const messages = session.messages || [];
    const msgIdx = messages.length;

    // Build content (text + images + extracted file text)
    const images = [...pendingImages];
    const attachments = [...pendingAttachments];
    clearImagePreviews();
    const attachmentText = attachments
      .map(file => `【附件：${file.name}】\n${file.content}`)
      .join('\n\n---\n\n');
    const finalText = [attachmentText, text].filter(Boolean).join('\n\n');

    let userContent;
    if (images.length > 0) {
      userContent = [
        ...images.map(img => ({
          type: 'image',
          source: { type: 'base64', media_type: img.mediaType, data: img.base64 },
        })),
        { type: 'text', text: finalText || '请看这张图片。' },
      ];
    } else {
      userContent = finalText;
    }

    const userTs = Date.now();
    appendBubble('user', userContent, msgIdx, false, images.map(i => i.dataUrl), userTs);
    messages.push({ role: 'user', content: userContent, timestamp: userTs });

    if (messages.length === 1 && !session.title_locked) {
      updateSession(currentSessionId, { title: (text || attachments[0]?.name || '图片').slice(0, 30), messages });
      renderSessionList();
    } else {
      updateSession(currentSessionId, { messages });
    }

    await callApi(messages);
  }

  function readBlobAsDataUrl(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => resolve(e.target.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  function loadImageElement(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        URL.revokeObjectURL(url);
        resolve(img);
      };
      img.onerror = () => {
        URL.revokeObjectURL(url);
        reject(new Error('这张图片格式暂时读不了'));
      };
      img.src = url;
    });
  }

  function canvasToBlob(canvas, type, quality) {
    return new Promise((resolve, reject) => {
      canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('图片压缩失败')), type, quality);
    });
  }

  async function compressImageForClaude(file) {
    const img = await loadImageElement(file);
    const maxSide = 1568;
    const ratio = Math.min(1, maxSide / Math.max(img.naturalWidth || img.width, img.naturalHeight || img.height));
    const width = Math.max(1, Math.round((img.naturalWidth || img.width) * ratio));
    const height = Math.max(1, Math.round((img.naturalHeight || img.height) * ratio));
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, width, height);
    ctx.drawImage(img, 0, 0, width, height);

    let blob = null;
    for (const quality of [0.86, 0.74, 0.62]) {
      blob = await canvasToBlob(canvas, 'image/jpeg', quality);
      if (blob.size <= 3.8 * 1024 * 1024) break;
    }
    const dataUrl = await readBlobAsDataUrl(blob);
    return {
      base64: dataUrl.split(',')[1],
      mediaType: 'image/jpeg',
      dataUrl,
      size: blob.size,
      name: file.name || 'photo.jpg',
    };
  }

  async function handleSelectedFiles(files) {
    const validDocs = ['txt', 'md', 'pdf', 'docx'];
    for (const file of files) {
      try {
        if (file.type.startsWith('image/')) {
          const imageData = await compressImageForClaude(file);
          addImageToPreview(imageData);
          continue;
        }
        const ext = file.name.split('.').pop().toLowerCase();
        if (!validDocs.includes(ext)) {
          appendBubble('assistant', `${file.name} 这个格式暂时不能直接发送`, -1, true);
          continue;
        }
        let content = await extractTextFromFile(file);
        if (!content.trim()) {
          appendBubble('assistant', `${file.name} 没有提取到文字`, -1, true);
          continue;
        }
        if (content.length > 12000) {
          content = content.slice(0, 12000) + '\n\n【文件内容较长，已截取前 12000 字。】';
        }
        addFileToPreview({ name: file.name, content, size: file.size });
      } catch (err) {
        appendBubble('assistant', `${file.name} 处理失败：${err.message}`, -1, true);
      }
    }
  }

    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  sendBtn.addEventListener('click', sendMessage);

  document.addEventListener('click', e => {
    if (settingsPanel.classList.contains('open') &&
        !settingsPanel.contains(e.target) &&
        e.target !== document.getElementById('settings-btn')) {
      settingsPanel.classList.remove('open');
    }
  });

  // ── Document file upload ──
  document.getElementById('doc-file-input').addEventListener('change', async function(e) {
    const files = Array.from(e.target.files);
    const status = document.getElementById('doc-upload-status');
    status.style.color = '#888';
    status.textContent = '处理中…';
    for (const file of files) {
      try {
        const content = await extractTextFromFile(file);
        if (!content.trim()) { status.style.color = '#ff6b6b'; status.textContent = `${file.name} 无法提取文字`; continue; }
        const f = { id: Date.now().toString() + Math.random().toString(36).slice(2), name: file.name, content, created_at: Date.now() };
        pinnedFiles.push(f);
        writeCachedList(PINNED_FILES_CACHE_KEY, pinnedFiles);
        await sbUpsertFile(f);
        renderFilesList();
        status.style.color = '#4caf50';
        status.textContent = `✓ ${file.name} 已添加`;
      } catch(err) {
        status.style.color = '#ff6b6b';
        status.textContent = `${file.name} 出错：${err.message}`;
      }
    }
    e.target.value = '';
  });

  // ── Attach image/file ──
  document.getElementById('attach-btn').addEventListener('click', () => {
    document.getElementById('file-input').click();
  });

  document.getElementById('file-input').addEventListener('change', async function(e) {
    const files = Array.from(e.target.files);
    await handleSelectedFiles(files);
    e.target.value = '';
  });

  function downloadJsonFile(data, filename) {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function sessionExportName(prefix, session) {
    const title = String(session?.title || 'session').replace(/[\\/:*?"<>|]+/g, '-').slice(0, 36);
    return `${prefix}-${title}-${Date.now()}.json`;
  }

  document.getElementById('export-current-session').addEventListener('click', () => {
    const status = document.getElementById('import-status');
    const session = getSession(currentSessionId);
    if (!session) {
      status.style.color = '#ff6b6b';
      status.textContent = '没有可导出的当前对话';
      return;
    }
    downloadJsonFile(session, sessionExportName('lucian-session', session));
    status.style.color = '#4caf50';
    status.textContent = `✓ 已导出：${session.title || '当前对话'}`;
  });

  document.getElementById('export-all-sessions').addEventListener('click', () => {
    const status = document.getElementById('import-status');
    const sessions = getSessions();
    if (sessions.length === 0) {
      status.style.color = '#ff6b6b';
      status.textContent = '没有可导出的对话';
      return;
    }
    downloadJsonFile({ sessions, exported_at: Date.now() }, `lucian-all-sessions-${Date.now()}.json`);
    status.style.color = '#4caf50';
    status.textContent = `✓ 已导出全部 ${sessions.length} 个对话`;
  });

  function normalizeImportedSessions(data) {
    const items = Array.isArray(data) ? data : Array.isArray(data?.sessions) ? data.sessions : [data];
    return items.filter(session => session?.id && Array.isArray(session.messages));
  }

  // ── Import session from JSON file ──
  document.getElementById('import-file').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const status = document.getElementById('import-status');
    status.style.color = '#888';
    status.textContent = '读取中…';
    const reader = new FileReader();
    reader.onload = function(ev) {
      try {
        const imported = normalizeImportedSessions(JSON.parse(ev.target.result));
        if (imported.length === 0) {
          status.style.color = '#ff6b6b';
          status.textContent = '文件格式不对';
          return;
        }
        const sessions = getSessions();
        [...imported].reverse().forEach(session => {
          const idx = sessions.findIndex(s => s.id === session.id);
          if (idx >= 0) sessions.splice(idx, 1);
          sessions.unshift(session);
        });
        saveSessions(sessions);
        imported.forEach(session => sbUpsertSession(session));
        renderSessionList();
        const first = imported[0];
        status.style.color = '#4caf50';
        status.textContent = imported.length === 1
          ? `✓ 导入成功，共 ${first.messages.length} 条消息`
          : `✓ 导入成功，共 ${imported.length} 个对话`;
        setTimeout(() => { loadSession(first.id); }, 500);
      } catch(err) {
        status.style.color = '#ff6b6b';
        status.textContent = '解析失败：' + err.message;
      }
    };
    reader.readAsText(file);
  });

  init();

  // ── PWA Service Worker ──
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      const previousVersion = localStorage.getItem('lucian_app_version');
      if (previousVersion && previousVersion !== APP_VERSION && window.caches) {
        caches.keys()
          .then(keys => Promise.all(keys.filter(key => key.startsWith('lucian-')).map(key => caches.delete(key))))
          .then(() => {
            localStorage.setItem('lucian_app_version', APP_VERSION);
            window.location.reload();
          })
          .catch(() => localStorage.setItem('lucian_app_version', APP_VERSION));
      } else {
        localStorage.setItem('lucian_app_version', APP_VERSION);
      }
      navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
        .then(registration => registration.update())
        .catch(() => {});
    });
  }
</script>
</body>
</html>
