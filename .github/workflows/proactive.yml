name: Lucian proactive check

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger proactive check
        run: |
          curl --fail --show-error --silent \
            -X POST "https://chat-app-gloria5.vercel.app/api/proactive/run" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
